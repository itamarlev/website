    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:96px}body{margin:0;background:linear-gradient(180deg,#f3efff 0,#fff9e9 42%,#eefcff 100%);color:var(--ink);font-family:"Arial","Noto Sans Hebrew",sans-serif;line-height:1.55}
    a{color:inherit}.top{position:relative;overflow:hidden;padding:22px 18px 36px;background:linear-gradient(135deg,#6847f5,#9b55ee 52%,#ff6f9c);color:white}.top:before,.top:after{position:absolute;border-radius:50%;content:"";filter:blur(1px);opacity:.22}.top:before{width:190px;height:190px;background:var(--yellow);top:-95px;left:-40px}.top:after{width:150px;height:150px;background:var(--sky);bottom:-80px;right:-35px}

    .points{display:grid;gap:9px;margin:0;padding:0;list-style:none}.point{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;padding:11px 12px;border-radius:15px;background:#f7f8ff}.point-icon{display:grid;width:36px;height:36px;place-items:center;border-radius:12px;background:var(--sky);font-size:1.1rem}.point:nth-child(2) .point-icon{background:var(--mint)}.point:nth-child(3) .point-icon{background:#ffd5e3}.point b{display:block;font-size:.96rem}.point span{display:block;margin-top:1px;color:var(--muted);font-size:.84rem}

      <p class="intro">בלי חפירות: מה עושים בכל יום, מה הכי מעניין, ועוד פרט אחד ששווה לדעת.</p>

<script>
(() => {
  const curated = {
    1:{title:"נוחתים ומתחילים!",summary:"נוחתים בציריך, לוקחים את הרכב ונוסעים למלון. הערב הזה מיועד רק להגיע, להתארגן ולנוח.",points:{"Zurich Airport":["✈️","משימת פתיחה: מי הראשון שמזהה מהחלון מטוס עם ציור או צבע ממש מוזר? מכאן מתחיל הטיול."],"Hilton Garden Inn Zurich Limmattal":["🛏️","הבסיס הראשון שלנו. תבחרו כבר עכשיו: מי אחראי מחר להזכיר לכולם לא לשכוח כלום בחדר?"]},fact:null},
    2:{title:"פרייבורג: עיר, תעלות ותצפית",summary:"יום של חיפוש פרטים מוזרים בפרייבורג: מפלצות על הקתדרלה, תעלות מים בין הרגליים ותצפית מעל הגגות. בערב, אם נשאר כוח, מחפשים את הפינה הכי פוטוגנית ב-Gengenbach.",points:{"Freiburg Minster":["⛪","הגעתם לסמל של פרייבורג. הסתכלו טוב על הפסלים והמפלצות שעל הקתדרלה: בצד הדרומי מסתתר אפילו גרגויל שמפנה אליכם את הטוסיק! מי מוצא אותו ראשון?"],"Freiburg Old Town":["💦","שימו לב לתעלות ה-Bächle הקטנות שזורמות ממש לצד הרחוב. אתגר: מי מצליח לעקוב אחרי אחת מהן הכי הרבה זמן בלי לאבד אותה?"],"Schlossbergbahn Freiburg":["🚡","עולים לכיוון התצפית. מלמעלה נסו לזהות שוב את הצריח הענק של הקתדרלה — הוא בולט מעל העיר."],"Gengenbach Old Town":["🌙","עיירה שנראית נהדר בערב. תחרות צילום: מי מוצא את הבית הכי צבעוני או הכי עקום?"]},fact:"בקתדרלת פרייבורג יש 91 גרגוילים ויצורים שמרחיקים מי גשם מהקירות — ואחד מהם מפורסם במיוחד בזכות הישבן החשוף שלו."},
    3:{title:"יום המפלים 🌲💦",summary:"היום נכנסים ממש לאווירת היער השחור: אולי עוצרים לקפה בדרך, מטפסים לצד המים השוצפים של Triberg ומסיימים בין שעוני קוקייה. לא חייבים לעשות הכול — בוחרים לפי הכוח והחשק.",points:{"Café Körbchen, Hausach":["🥐","עצירה אופציונלית בדרך. אם עוצרים: כל אחד בוחר מאפה או משקה, ואז עושים דירוג משפחתי זריז — מי עשה את הבחירה הכי מוצלחת?"],"Dorfbeck Karl-Heinz & Elke Wöhrle, Gutach":["☕","האופציה השנייה לקפה, קרובה יותר ל-Triberg. אתגר קטן: מי מצליח למצוא משהו בתצוגה שנראה הכי ״יער שחור״?"],"Triberg Waterfalls":["💦","אל תסתפקו בלהסתכל: תקשיבו לרעש, חפשו את המקום שבו מרגישים את רסס המים ונסו לספור כמה מדרגות מפל אתם מצליחים לזהות. רשמית יש שבע מדרגות גדולות לאורך 163 מטר — ובשבילים אפשר לפגוש סנאים."],"Triberg im Schwarzwald":["🕰️","Triberg מכנה את עצמה בירת שעוני הקוקייה של היער השחור. משימת הרחוב: מי מוצא את שעון הקוקייה הכי מוגזם? בונוס: ליד House of 1000 Clocks יש משפחת דובים מוזיקלית שפועלת כל רבע שעה."]},fact:"אנקדוטה מקומית: לפי עיריית Triberg, לעיר היו תאורת הרחוב החשמלית הראשונה בגרמניה וגם מעלית הסקי החשמלית הראשונה בעולם — ואפילו המינגוויי הגיע לכאן בגלל פורל היער השחור."},
    4:{title:"Europa-Park! 🎢",summary:"יום שבו כל אחד בוחר את סוג האומץ שלו: רכבות הרים וצרחות ב-Europa-Park, או מים חמים וקצב רגוע ב-Baden-Baden. בסוף היום משווים מי נהנה יותר.",points:{"Europa-Park":["🎢","יותר מ־100 מתקנים ומופעים ו־14 רכבות הרים. משימת היום: כל אחד בוחר מתקן אחד שהוא חייב לנסות — ובסוף מדרגים את המנצח."],"Caracalla Therme":["♨️","מי שבקבוצה הרגועה מקבל משימה הפוכה לגמרי: למצוא את הבריכה הכי נעימה ולבדוק מי מצליח באמת לא למהר לשום מקום."],"Lichtentaler Allee":["🌳","שדרה ירוקה ורגועה ב-Baden-Baden. נסו למצוא בדרך את העץ הכי ענק או הכי מוזר."]},fact:"Europa-Park מחולק ל־21 אזורים מעוצבים; 18 מהם מייצגים מדינות ואזורים באירופה."},
    5:{title:"שטרסבורג מהמים ומהרחובות",summary:"רואים את שטרסבורג קודם מהמים ואז מקרוב: בתים שנראים מסיפור, שעון אסטרונומי עם דמויות זזות וגשרים עתיקים. היום הוא משחק של ״מי שם לב לפרט הכי מוזר״.",points:{"Batorama":["🛥️","עולים לסירה ורואים את העיר מגובה המים. נסו לזהות בדרך בית שנראה כאילו הוא יצא מסיפור — ולצלם אותו מהסירה."],"Strasbourg Cathedral":["⛪","הקתדרלה הוורודה עצומה. בפנים מסתתר שעון אסטרונומי עם דמויות זזות, שליחים ומוות. אם אתם לידו — נסו למצוא את התרנגול שבמנגנון."],"Petite France":["🏘️","תעלות, גשרים ובתי עץ צפופים. אתגר: מצאו את הבית עם הכי הרבה קורות עץ על החזית."],"Ponts Couverts":["🌉","מהגשרים נסו לזהות את המגדלים העתיקים ולבחור מי מהם נראה הכי מתאים לטירה בסרט."]},fact:"בשעון האסטרונומי של הקתדרלה יש דמויות מכניות, ובמופע היומי אפילו תרנגול גדול משמיע קריאה."},
    6:{title:"יום אקשן ב-Mehliskopf",summary:"יום אקשן אחד גדול: גובה, חבלים, מהירות וקצת צרחות. כל אחד בוחר את האתגר שלו — לא צריך להיות הכי אמיץ, רק לנסות משהו שמרגיש כמו הישג.",points:{"פארק החבלים":["🧗","מטפסים בין עצים בגובה שמגיע עד 14 מטר. בחרו לעצמכם 'שלב בוס' — המכשול שנראה הכי מפחיד — ותראו מי כובש אותו."],"מגלשת ההרים":["🛷","1,300 מטר, 13 פניות תלולות ועד 40 קמ״ש. אחרי הירידה כל אחד נותן ציון לצרחה של עצמו מ־1 עד 10."],"בנג׳י טרמפולינה":["🤸","כאן המטרה היא לעלות גבוה. מי מצליח להגיע לרגע שבו הוא מרגיש כמעט בלי משקל?"],"Downhill Carts":["🏎️","ירידה של כ־500 מטר בקארט שטח. הפעילות הזו תלויה בגיל, בתנאים ובפתיחה במקום."]},fact:"במגלשת ההרים עוברים גם חמש מנהרות ושמונה חציות מים — והקרונית נשארת מחוברת למסילה כל הדרך."},
    7:{title:"עוברים לאלזס 🏘️",summary:"עוברים לאלזס ונכנסים לעולם של בתים צבעוניים, קורות עץ וטירות על ההרים. זה יום מצוין לתחרות ״הבית שנראה הכי פחות אמיתי״.",points:{"Guémar":["🏠","בית חדש לכמה לילות. אתגר ההתמקמות: מי מוצא ראשון את המקום הכי טוב בבית לשבת בו בסוף יום טיול?"],"Riquewihr":["🏘️","כפר אלזסי צבעוני עם בתי עץ צפופים. תחרות: מצאו את הבית שנראה לכם הכי פחות אמיתי — כאילו בנו אותו מסוכריות."],"Ribeauvillé":["🏰","הרימו את הראש לכיוון ההרים: מעל האזור יש שרידי טירות. מי מצליח לזהות ראשון משהו שנראה כמו מגדל או חומה?"]},fact:null},
    8:{title:"טירה וקופים! 🏰🐒",summary:"מתחילים כמו מגיני טירה מימי הביניים ומסיימים כאורחים אצל קופים שמסתובבים ביער. היום מחפשים סימני הגנה בטירה והתנהגויות מצחיקות אצל המקוקים.",points:{"Château du Haut-Koenigsbourg":["🏰","זה הזמן לשחק 'מגיני הטירה': חפשו חומה, מגדל, חרך ירי וגשר — ארבעה דברים שהיו עוזרים לכם להגן על המקום."],"La Montagne des Singes":["🐒","כאן אתם האורחים והמקוקים הברבריים הם המקומיים. נסו לזהות מי מנקה למי את הפרווה ומי פשוט יושב ומסתכל על כולם."]},fact:"הטירה יושבת בגובה של בערך 757 מטר — מיקום מצוין למי שרצה לראות אויבים מתקרבים מרחוק."},
    9:{title:"קולמר וכפר מהאגדות",summary:"יום של צבעים, תעלות ואוכל: מצלמים השתקפויות בקולמר, מחפשים משהו מעניין לטעום בשוק ואז מנסים לא ללכת לאיבוד ברחובות המעגליים של Eguisheim.",points:{"Little Venice":["🚤","זה החלק של קולמר עם התעלות והבתים הצבעוניים. משימת צילום: מצאו השתקפות מושלמת של בית בתוך המים."],"Marché Couvert":["🥨","השוק המקורה פועל במבנה משנת 1865. כל אחד בוחר משהו אחד שהיה מוכן לטעום — גם אם הוא נראה קצת מוזר."],"Eguisheim":["🏘️","הכפר בנוי במעגלים סביב הטירה שבמרכז. נסו ללכת ברחוב המעגלי ולגלות: האם אתם חוזרים כמעט לאותה נקודה בלי להסתכל במפה?"]},fact:"Eguisheim בנויה כמו טבעות סביב המרכז — כמעט כמו מבוך עגול קטן של רחובות צבעוניים."},
    10:{title:"חוזרים לציריך",summary:"סיבוב הפרידה: חוזרים לציריך, מחפשים את המגדלים התאומים בעיר העתיקה ואת הברבורים באגם, ואז כל אחד בוחר את שלושת רגעי הטיול שהוא לוקח הביתה.",points:{"Zurich Old Town":["🏙️","בעיר העתיקה חפשו את שני המגדלים התאומים של Grossmünster. אם נכנסים לאזור הכנסייה, יש שם גם דמויות ויצורים מוזרים באבן."],"Bürkliplatz / Lake Zurich":["🌊","עומדים ליד האגם ומחפשים את הנוף הכי רחוק שאפשר לראות. בונוס: מי מוצא ראשון ברבור או סירה?"],"Hilton Garden Inn":["🛏️","הלילה האחרון. משימת סיום: כל אחד בוחר את הרגע הכי מצחיק, הכי מפחיד והכי טעים של הטיול."]},fact:"באחד ממגדלי Grossmünster אפשר לעלות 187 מדרגות לתצפית על העיר והאגם."},
    11:{title:"הביתה ✈️",summary:"קמים מוקדם, מחזירים את הרכב בשדה התעופה ונכנסים לטיסה הביתה. זהו — הטיול נגמר!",points:{"Zurich Airport / SIXT return":["🚗","מחזירים את הרכב ב־08:00. משימת הדרך האחרונה: לפני שיוצאים מהרכב, כל אחד בודק כיסים, מושב ורצפה — שלא נשאיר מזכרת לשווייץ."]},fact:"הטיסה מתוכננת לצאת ב־10:55 ולנחות בתל אביב ב־15:50."}
  };

  // Fingerprints of the adult itinerary at the time these child-friendly summaries were written.
  // If title, description, points, constraints or an important note changes, the curated copy is hidden
  // and the page falls back to the live adult itinerary instead of presenting stale information.
  const expectedSignature = {
    1:"iglo69",2:"11w94j9",3:"ac73at",4:"ea1qu8",5:"1645fe4",6:"106e6u8",
    7:"1pht3ib",8:"14b6zkw",9:"1l7n7js",10:"ood8i2",11:"1vn7wwe"
  };
  const dayDates=["2026-09-22","2026-09-23","2026-09-24","2026-09-25","2026-09-26","2026-09-27","2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02"];
  const hebDays=["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","יום שישי","שבת"];
  const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  const textOf=(el)=>el?.textContent?.replace(/\s+/g," ").trim()||"";
  const zurichDate=()=>{
    try {
      const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Zurich",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
      const v=Object.fromEntries(p.filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));
      return `${v.year}-${v.month}-${v.day}`;
    } catch(_){ return new Date().toISOString().slice(0,10); }
  };
  const currentDate=zurichDate();
  const currentDay=dayDates.indexOf(currentDate)+1;

  function shortFallback(desc){
    const parts=desc.split(/(?<=[.!?])\s+/).filter(Boolean);
    return parts.slice(0,2).join(" ").slice(0,260);
  }
  function sourceHash(value){
    let h=2166136261;
    for(let i=0;i<value.length;i++){h^=value.charCodeAt(i);h=Math.imul(h,16777619);}
    return (h>>>0).toString(36);
  }
  function renderPoint(name, item, liveDescription){
    const icon=item?.[0]||"🔎";
    const desc=item?.[1]||liveDescription||"עצירה חדשה במסלול — תסתכלו סביב ובחרו דבר אחד מצחיק, מוזר או יפה ששווה לזכור.";
    return `<li class="point"><span class="point-icon">${icon}</span><div><b>${esc(name)}</b><span>${esc(desc)}</span></div></li>`;
  }

  function makeImageReliable(img){
    let attempt=0;
    let timer;
    const retry=()=>{
      if(attempt>=2) return;
      attempt+=1;
      try{
        const url=new URL(img.currentSrc||img.src,location.href);
        if(url.hostname==="commons.wikimedia.org"){
          if(attempt===2) url.pathname=url.pathname.replace("/wiki/Special:FilePath/","/wiki/Special:Redirect/file/");
          url.searchParams.set("width",attempt===1?"1280":"960");
          url.searchParams.set("retry",String(attempt));
          img.src=url.toString();
        }
      }catch(_){}
    };
    const arm=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!img.complete||!img.naturalWidth) retry();},9000);};
    img.addEventListener("load",()=>clearTimeout(timer),{once:false});
    img.addEventListener("error",()=>{clearTimeout(timer);retry();arm();});
    arm();
  }

  fetch("../index.html?kids-source=20260923-2", {cache:"no-store"})
    .then(r=>{if(!r.ok) throw new Error("source"); return r.text();})
    .then(source=>{
      const doc=new DOMParser().parseFromString(source,"text/html");
      const root=document.getElementById("kids-days");
      const strip=document.getElementById("day-strip");
      root.className="";
      root.innerHTML="";
      strip.innerHTML="";
      for(let n=1;n<=11;n++){
        const src=doc.getElementById(`day-${n}`);
        if(!src) continue;
        const srcTitle=textOf(src.querySelector(".day-body h3"));
        const srcDesc=textOf(src.querySelector(".day-description"));
        const pointRows=[...src.querySelectorAll(".day-points li")];
        const srcPoints=pointRows.map((row)=>textOf(row.querySelector(":scope > a"))).filter(Boolean);
        const livePointDescriptions=Object.fromEntries(pointRows.map((row)=>{
          const name=textOf(row.querySelector(":scope > a"));
          const detail=textOf(row.querySelector(":scope > span"));
          return [name,detail];
        }).filter(([name])=>name));
        const img=src.querySelector(".day-photo img")?.getAttribute("src")||"";
        const date=dayDates[n-1];
        const d=new Date(date+"T12:00:00Z");
        const dayName=hebDays[d.getUTCDay()];
        const dd=date.slice(8,10)+"/"+date.slice(5,7);
        const data=curated[n];
        const srcDetails=textOf(src.querySelector(".day-points"));
        const srcNote=textOf(src.querySelector(".important-note"));
        const liveSignature=sourceHash([srcTitle,srcDesc,srcDetails,srcNote].join("||"));
        const changed=liveSignature!==expectedSignature[n];
        const isToday=n===currentDay;

        const chip=document.createElement("a");
        chip.className="day-chip"+(isToday?" today":"");
        chip.href=`#kids-day-${n}`;
        chip.innerHTML=`<b>יום ${n}</b><small>${dd}</small>`;
        strip.append(chip);

        const card=document.createElement("article");
        card.className="day"+(isToday?" today":"");
        card.id=`kids-day-${n}`;
        const summary=changed ? shortFallback(srcDesc) : data.summary;
        const title=changed ? srcTitle : data.title;
        const shownPoints=srcPoints.slice(0,4);
        const pointHtml=shownPoints.map(name=>renderPoint(name,data.points[name],livePointDescriptions[name])).join("");
        const fact=(!changed && data.fact)?`<div class="fact"><b>🤯 ידעת?</b>${esc(data.fact)}</div>`:"";
        const update="";
        card.innerHTML=`
          <div class="photo">${img?`<img src="${esc(img)}" alt="" loading="${isToday?"eager":"lazy"}" decoding="async"${isToday?' fetchpriority="high"':""}>`:""}<div class="day-no"><span>יום</span><b>${n}</b></div></div>
          <div class="content">
            <p class="date">${dayName} · ${dd}${isToday?" · היום ⭐":""}</p>
            <h2>${esc(title)}</h2>
            <p class="summary"><b>מה עושים?</b> ${esc(summary)}</p>
            <ul class="points">${pointHtml}</ul>
            ${fact}${update}
            <div class="footer-row"><a class="full-link" href="../#day-${n}">רוצים את כל הפרטים? לגרסה המלאה ←</a><span class="stamp">מסונכרן מהמסלול הראשי</span></div>
          </div>`;
        root.append(card);
        card.querySelectorAll("img").forEach(makeImageReliable);
      }
      if(currentDay>0){
        const pill=document.getElementById("today-pill");
        pill.textContent=`⭐ היום אנחנו ביום ${currentDay}`;
        pill.classList.add("show");
        history.scrollRestoration="manual";
        const jump=()=>document.getElementById(`kids-day-${currentDay}`)?.scrollIntoView({block:"start",behavior:"auto"});
        setTimeout(jump,80);
        window.addEventListener("load",()=>setTimeout(jump,120),{once:true});
      }
    })
    .catch(()=>{
      document.getElementById("kids-days").className="error";
      document.getElementById("kids-days").innerHTML='לא הצלחנו לקרוא עכשיו את המסלול המעודכן, ולכן לא נציג מידע ישן. <br><a href="../">עברו לגרסה המלאה ←</a>';
    });
})();
</script>
