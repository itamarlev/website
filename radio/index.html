<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eef4f2" />
  <meta name="description" content="דף קישורים נקי לתחנות הרדיו הראשיות בישראל, בלי פרסומות, עם נגן שידור חי ישיר." />
  <title>תחנות רדיו בישראל | itamarlev.com</title>
  <style>
    :root{
      --bg:#f3f6f5;
      --card:#ffffff;
      --ink:#1c2420;
      --muted:#5f6b66;
      --line:#dde6e2;
      --accent:#2f6b63;
      --accent-soft:#e4efec;
      --shadow:0 10px 30px rgba(20,40,34,.08);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg,#eef3f1 0,#f6f8f7 260px,var(--bg) 100%);
      color:var(--ink);
      font-family:Arial,"Noto Sans Hebrew",sans-serif;
      line-height:1.6;
    }
    .wrap{max-width:900px;margin:auto;padding:28px 20px 90px}
    nav.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:14px}
    nav.top a{color:var(--muted);text-decoration:none;font-weight:600}
    nav.top a.brand{color:var(--accent);font-weight:800}
    nav.top a:hover{color:var(--accent)}
    header{text-align:center;margin-bottom:34px}
    .badge{
      display:inline-flex;align-items:center;gap:8px;
      background:var(--accent-soft);color:var(--accent);
      border:1px solid #c9ddd5;border-radius:999px;
      padding:7px 14px;font-weight:700;font-size:13px;margin-bottom:14px
    }
    h1{font-size:clamp(28px,5vw,42px);margin:0 0 10px;letter-spacing:-0.5px}
    .lead{color:var(--muted);font-size:16px;max-width:580px;margin:0 auto}
    h2.group{
      font-size:15px;color:var(--accent);font-weight:800;
      margin:34px 0 14px;padding-right:12px;border-right:3px solid var(--accent);
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
      gap:14px;
    }
    .station{
      display:flex;flex-direction:column;align-items:stretch;
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);overflow:hidden;transition:transform .12s, border-color .12s;
    }
    .station:hover{transform:translateY(-2px);border-color:#a9c7bc}
    .station.playing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft), var(--shadow)}
    .logo-btn{
      position:relative;aspect-ratio:1/1;width:100%;border:0;padding:16px;
      background:#fbfdfc;cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .logo-btn img{max-width:100%;max-height:100%;object-fit:contain}
    .play-indicator{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(20,40,34,0);opacity:0;transition:opacity .15s;
    }
    .logo-btn:hover .play-indicator{opacity:1;background:rgba(20,40,34,.45)}
    .station.playing .play-indicator{opacity:1;background:rgba(20,40,34,.5)}
    .play-indicator svg{width:34px;height:34px;fill:#fff}
    .station-info{padding:10px 12px 14px;text-align:center}
    .station-info .name{font-weight:700;font-size:14px;display:block;margin-bottom:2px}
    .station-info .freq{color:var(--muted);font-size:11px;display:block;margin-bottom:6px}
    .station-info a.site-link{color:var(--muted);font-size:11px;text-decoration:none;border-bottom:1px dotted var(--muted)}
    .station-info a.site-link:hover{color:var(--accent);border-color:var(--accent)}
    .now-playing-bar{
      position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;
      display:flex;align-items:center;gap:14px;padding:12px 20px;
      transform:translateY(100%);transition:transform .25s;z-index:50;
      box-shadow:0 -8px 24px rgba(0,0,0,.2);
    }
    .now-playing-bar.show{transform:translateY(0)}
    .now-playing-bar img{width:36px;height:36px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
    .now-playing-bar .np-text{flex:1;font-size:13px}
    .now-playing-bar .np-text strong{display:block;font-size:14px}
    .now-playing-bar button{
      background:var(--accent);color:#fff;border:0;border-radius:999px;
      width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .now-playing-bar button svg{width:18px;height:18px;fill:#fff}
    footer{text-align:center;color:var(--muted);font-size:13px;margin-top:52px}
    footer a{color:var(--accent);text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="top">
      <a class="brand" href="/">itamarlev.com</a>
      <a href="/">חזרה לדף הבית ←</a>
    </nav>

    <header>
      <span class="badge">📻 כלי אישי</span>
      <h1>תחנות הרדיו הראשיות בישראל</h1>
      <p class="lead">בלי פרסומות, בלי כניסה לאתר התחנה — לוחצים על הלוגו והשידור החי מתחיל ישר כאן.</p>
    </header>

    <h2 class="group">תחנות ציבוריות (כאן)</h2>
    <div class="grid" id="group-kan"></div>

    <h2 class="group">תחנות צבאיות ומסחריות גדולות</h2>
    <div class="grid" id="group-commercial"></div>

    <h2 class="group">תחנות אזוריות</h2>
    <div class="grid" id="group-regional"></div>

    <footer>
      <p>itamarlev.com · <a href="/">חזרה לדף הבית</a></p>
    </footer>
  </div>

  <div class="now-playing-bar" id="npBar">
    <img id="npLogo" src="" alt="" />
    <div class="np-text">
      <strong id="npName">—</strong>
      <span>משדר כעת</span>
    </div>
    <button id="npToggle" aria-label="עצור / נגן">
      <svg id="npIcon" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
  </div>

  <script>
    const STATIONS = {
      "group-kan": [
        { name: "כאן ב׳", freq: "חדשות ואקטואליה", logo: "https://upload.wikimedia.org/wikipedia/commons/4/49/KanReshetBetLogo.svg", stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/KAN_BET.mp3", site: "https://www.kan.org.il/content/kan/kan-b/" },
        { name: "כאן גימל", freq: "מוזיקה ישראלית", logo: "https://upload.wikimedia.org/wikipedia/commons/3/39/KanGimel.svg", stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/KAN_GIMMEL.mp3", site: "https://www.kan.org.il/content/kan/kan-gimel/" },
        { name: "כאן תרבות", freq: "תרבות וספרות", logo: "https://upload.wikimedia.org/wikipedia/commons/e/ed/KanTarbutNewLogo.svg", stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/KAN_TARBUT.mp3", site: "https://www.kan.org.il/content/kan/kan-tarbut/" },
        { name: "כאן 88", freq: "רוק ואינדי", logo: "https://upload.wikimedia.org/wikipedia/he/0/09/Kan88Logo.svg", stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/KAN_88.mp3", site: "https://www.kan.org.il/content/kan/kan-88/" },
        { name: "כאן רקע", freq: "מוזיקת רקע", logo: "https://upload.wikimedia.org/wikipedia/commons/6/67/IPBC_LOGO_KAN.svg", stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/KAN_REKA.mp3", site: "https://www.kan.org.il/content/kan/kan-reka/" },
      ],
      "group-commercial": [
        { name: "גלי צה״ל", freq: "GLZ", logo: "https://upload.wikimedia.org/wikipedia/commons/3/30/GaltzLogo.svg", stream: "https://glzicylv01.bynetcdn.com/glz_mp3", site: "https://glz.co.il/" },
        { name: "גלגלצ", freq: "מוזיקה", logo: "https://upload.wikimedia.org/wikipedia/he/4/40/Galgalz.svg", stream: "https://glzicylv01.bynetcdn.com/glglz_mp3", site: "https://glz.co.il/%D7%92%D7%9C%D7%92%D7%9C%D7%A6" },
        { name: "103FM", freq: "רדיוס", logo: "https://upload.wikimedia.org/wikipedia/he/7/72/103FM.svg", stream: "https://cdn.cybercdn.live/103FM/Live/icecast.audio", site: "https://103fm.maariv.co.il/" },
        { name: "רדיו תל אביב", freq: "102FM", logo: "https://upload.wikimedia.org/wikipedia/he/0/09/102fmdec2025.png", stream: "https://cdn88.mediacast.co.il/102-tlv-live/102fm_aac/icecast.audio", site: "https://102fm.co.il/" },
        { name: "אקו 99", freq: "99FM", logo: "https://upload.wikimedia.org/wikipedia/he/0/0a/Eco_99_fm.svg", stream: "https://eco01.livecdn.biz/ecolive/99fm_aac/icecast.audio", site: "https://eco99fm.maariv.co.il/" },
        { name: "100FM", freq: "רדיוס", logo: "https://upload.wikimedia.org/wikipedia/he/d/d9/Radio100fm.svg", stream: "https://cdn.cybercdn.live/Radios_100FM/Audio/icecast.audio", site: "https://www.100fm.co.il/" },
      ],
      "group-regional": [
        { name: "קול ברמה", freq: "אזורי", logo: "https://upload.wikimedia.org/wikipedia/he/4/48/%D7%9C%D7%95%D7%92%D7%95_%D7%A7%D7%95%D7%9C_%D7%91%D7%A8%D7%9E%D7%94.png", stream: "http://kb.cdnwz.net/kol_barama", site: "https://www.kol-barama.co.il/" },
        { name: "רדיו ירושלים", freq: "101FM", logo: "https://upload.wikimedia.org/wikipedia/he/a/a7/Radio101.jpg", stream: "https://radio.streamgates.net/stream/101fm", site: "https://www.rlive.co.il/station/101fm" },
        { name: "קול חי", freq: "בני ברק / דתי", logo: "https://kcm.fm/static/images/favicon-96x96.png", stream: "https://media2.93fm.co.il/live-new", site: "https://www.93fm.co.il/" },
        { name: "קול רגע", freq: "96FM", logo: "https://upload.wikimedia.org/wikipedia/commons/5/52/%D7%9C%D7%95%D7%92%D7%95_%D7%A8%D7%93%D7%99%D7%95_%D7%A7%D7%95%D7%9C_%D7%A8%D7%92%D7%A2_%D7%A0%D7%A7%D7%99.png", stream: "https://cdn.cybercdn.live/Kol_Rega/Live_Audio/icecast.audio", site: "https://96fm.co.il/" },
      ],
    };

    const audio = new Audio();
    audio.preload = "none";
    let activeCard = null;
    let activeStation = null;

    const npBar = document.getElementById("npBar");
    const npLogo = document.getElementById("npLogo");
    const npName = document.getElementById("npName");
    const npToggle = document.getElementById("npToggle");
    const npIcon = document.getElementById("npIcon");

    const PAUSE_ICON = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
    const PLAY_ICON = '<path d="M7 5l12 7-12 7z"/>';

    function setPlayingUI(card, playing) {
      if (!card) return;
      card.classList.toggle("playing", playing);
    }

    function stopPlayback() {
      audio.pause();
      if (activeCard) setPlayingUI(activeCard, false);
      npBar.classList.remove("show");
      activeCard = null;
      activeStation = null;
    }

    function playStation(station, card) {
      if (activeStation === station) {
        stopPlayback();
        return;
      }
      if (activeCard) setPlayingUI(activeCard, false);
      audio.src = station.stream;
      audio.play().catch(() => {});
      activeCard = card;
      activeStation = station;
      setPlayingUI(card, true);

      npLogo.src = station.logo;
      npLogo.alt = station.name;
      npName.textContent = station.name;
      npIcon.innerHTML = PAUSE_ICON;
      npBar.classList.add("show");
    }

    npToggle.addEventListener("click", () => {
      if (!activeStation) return;
      if (audio.paused) {
        audio.play().catch(() => {});
        npIcon.innerHTML = PAUSE_ICON;
        setPlayingUI(activeCard, true);
      } else {
        audio.pause();
        npIcon.innerHTML = PLAY_ICON;
        setPlayingUI(activeCard, false);
      }
    });

    audio.addEventListener("error", () => {
      if (activeCard) {
        const info = activeCard.querySelector(".freq");
        if (info) info.textContent = "לא ניתן להתחבר כרגע — נסו לפתוח באתר התחנה";
      }
    });

    function renderGroup(groupId, stations) {
      const container = document.getElementById(groupId);
      stations.forEach((station) => {
        const card = document.createElement("div");
        card.className = "station";
        card.innerHTML = `
          <button class="logo-btn" aria-label="נגן ${station.name}">
            <img src="${station.logo}" alt="${station.name}" loading="lazy" />
            <span class="play-indicator">
              <svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>
            </span>
          </button>
          <div class="station-info">
            <span class="name">${station.name}</span>
            <span class="freq">${station.freq}</span>
            <a class="site-link" href="${station.site}" target="_blank" rel="noopener">אתר התחנה ↗</a>
          </div>
        `;
        card.querySelector(".logo-btn").addEventListener("click", () => playStation(station, card));
        container.appendChild(card);
      });
    }

    Object.entries(STATIONS).forEach(([groupId, stations]) => renderGroup(groupId, stations));
  </script>
</body>
</html>
