<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagaya · Lead of AI — Interview Presentation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --blue:#2563EB;
  --blue-2:#3B82F6;
  --blue-ink:#1D4ED8;
  --cta:#F97316;
  --bg:#F8FAFC;
  --surface:#FFFFFF;
  --ink:#1E293B;
  --ink-2:#475569;
  --ink-3:#94A3B8;
  --line:#E2E8F0;
  --line-2:#CBD5E1;
  --soft:#EFF4FF;
  --green:#059669;
  --amber:#D97706;
  --radius:14px;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
  --shadow-lg:0 12px 40px rgba(15,23,42,.12);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Open Sans',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,.font-head{font-family:'Poppins',sans-serif;letter-spacing:-.01em}

/* ---------- progress + chrome ---------- */
#progress{position:fixed;top:0;left:0;height:3px;background:var(--blue);width:0;z-index:60;transition:width .35s cubic-bezier(.2,.7,.2,1)}
#topbar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:50;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font-family:'Poppins';font-weight:600;font-size:14px;color:var(--ink);letter-spacing:.02em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.brand .sep{color:var(--line-2);font-weight:400}
.brand .role{color:var(--ink-3);font-weight:500}
.counter{font-family:'Poppins';font-size:13px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.counter b{color:var(--ink);font-weight:600}

/* ---------- slides ---------- */
#deck{position:relative;height:100%;width:100%}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:74px 7vw 84px;
  opacity:0;visibility:hidden;
  transform:translateX(40px);
  transition:opacity .5s ease, transform .5s cubic-bezier(.2,.7,.2,1), visibility .5s;
  overflow-y:auto;
}
.slide.active{opacity:1;visibility:visible;transform:translateX(0)}
.slide.prev{transform:translateX(-40px)}
.wrap{width:100%;max-width:1120px;margin:0 auto}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Poppins';font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:18px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--blue);display:inline-block}
h2.title{font-size:clamp(26px,3.4vw,42px);font-weight:600;line-height:1.08;margin-bottom:14px}
.lede{font-size:clamp(15px,1.4vw,18px);color:var(--ink-2);max-width:760px;line-height:1.6;margin-bottom:30px}

/* ---------- nav ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:50}
.dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap;max-width:60%}
.dots button{width:9px;height:9px;border-radius:50%;border:none;background:var(--line-2);cursor:pointer;padding:0;transition:all .25s}
.dots button:hover{background:var(--blue-2)}
.dots button.on{background:var(--blue);width:26px;border-radius:5px}
.arrows{display:flex;gap:10px}
.arrows button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:all .2s;box-shadow:var(--shadow)}
.arrows button:hover:not(:disabled){border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
.arrows button:disabled{opacity:.35;cursor:not-allowed}
.arrows svg{width:18px;height:18px}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.card .ico{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--blue);display:grid;place-items:center;margin-bottom:14px}
.card .ico svg{width:20px;height:20px}
.card h3{font-size:16px;font-weight:600;margin-bottom:6px}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.card .big{font-family:'Poppins';font-size:30px;font-weight:600;color:var(--blue);line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.card .lbl{font-size:12.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--blue-ink);border:1px solid #DBEAFE}
.chip.cta{background:#FFF1E6;color:#C2410C;border-color:#FFE0C2}
.chip.green{background:#ECFDF5;color:#047857;border-color:#A7F3D0}
.gate{font-size:11.5px;color:var(--ink-2);background:var(--soft);border:1px solid #DBEAFE;border-radius:8px;padding:8px 11px;margin-top:12px;line-height:1.45}
.gate b{color:var(--blue-ink);font-weight:600}
.compound{font-size:11.5px;color:var(--blue-ink);margin-top:12px;padding-top:11px;border-top:1px dashed var(--line-2);display:flex;gap:7px;align-items:flex-start;line-height:1.4;font-weight:600}
.compound svg{width:14px;height:14px;flex-shrink:0;margin-top:1px;color:var(--blue)}

ul.ticks{list-style:none;display:flex;flex-direction:column;gap:11px}
ul.ticks li{display:flex;gap:11px;font-size:14px;color:var(--ink-2);line-height:1.5}
ul.ticks li svg{width:18px;height:18px;color:var(--blue);flex-shrink:0;margin-top:2px}
ul.ticks li b{color:var(--ink);font-weight:600}

.kpi-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.kpi{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:16px 18px}
.kpi .n{font-family:'Poppins';font-size:26px;font-weight:600;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.kpi .t{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.4}

/* ---------- flow chart ---------- */
.flow{display:flex;flex-direction:column;gap:18px}
.flow-row{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;justify-content:center}
.fstep{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:152px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.fstep .num{position:absolute;top:-9px;left:-9px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-family:'Poppins';font-size:12px;font-weight:600;display:grid;place-items:center;box-shadow:0 2px 6px rgba(37,99,235,.4)}
.fstep .fico{width:30px;height:30px;border-radius:8px;background:var(--soft);color:var(--blue);display:grid;place-items:center}
.fstep .fico svg{width:17px;height:17px}
.fstep h4{font-family:'Poppins';font-size:13px;font-weight:600;line-height:1.2}
.fstep p{font-size:11px;color:var(--ink-3);line-height:1.4}
.fstep.blackbox{background:#0F172A;border-color:#0F172A}
.fstep.blackbox h4,.fstep.blackbox p{color:#fff}
.fstep.blackbox p{color:#94A3B8}
.fstep.blackbox .fico{background:rgba(255,255,255,.12);color:#fff}
.fstep.blackbox .num{background:var(--cta);box-shadow:0 2px 6px rgba(249,115,66,.5)}
.fstep.cta-step{border-color:var(--cta);border-width:1.5px}
.fstep.cta-step .num{background:var(--cta)}
.fstep.cta-step .fico{background:#FFF1E6;color:var(--cta)}
.arrow-h{display:flex;align-items:center;color:var(--line-2);padding:0 4px}
.arrow-h svg{width:26px;height:26px}
.fnote{display:flex;align-items:center;gap:10px;background:#0F172A;color:#E2E8F0;border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.5;max-width:680px;margin:4px auto 0}
.fnote svg{width:18px;height:18px;color:var(--cta);flex-shrink:0}
.fnote b{color:#fff}
.feedback-bar{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--green);font-size:12.5px;font-weight:600;background:#ECFDF5;border:1px dashed #6EE7B7;border-radius:999px;padding:8px 18px;width:fit-content;margin:2px auto 0}
.feedback-bar svg{width:16px;height:16px}

/* ---------- timeline ---------- */
.tl{position:relative;display:flex;flex-direction:column;gap:0}
.tl-track{position:absolute;left:0;right:0;top:8px;height:3px;background:var(--line);border-radius:2px}
.tl-fill{position:absolute;left:0;top:8px;height:3px;background:linear-gradient(90deg,var(--blue),var(--blue-2));border-radius:2px}
.tl-steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;position:relative}
.tl-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.tl-node{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--blue);z-index:2;margin-bottom:14px}
.tl-step.accent .tl-node{background:var(--cta);border-color:var(--cta)}
.tl-wk{font-family:'Poppins';font-size:12px;font-weight:600;color:var(--blue)}
.tl-step.accent .tl-wk{color:var(--cta)}
.tl-step.dim .tl-node{border-color:var(--line-2)}
.tl-step.dim .tl-wk,.tl-step.dim .tl-name{color:var(--ink-3)}
.tl-name{font-family:'Poppins';font-size:13px;font-weight:600;color:var(--ink)}
.tl-desc{font-size:11.5px;color:var(--ink-3);line-height:1.4}

/* ---------- architecture ---------- */
.arch{display:flex;flex-direction:column;gap:9px}
.arch-layer{display:flex;align-items:flex-start;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow)}
.arch-layer .lico{width:36px;height:36px;border-radius:9px;background:var(--soft);color:var(--blue);display:grid;place-items:center;flex-shrink:0}
.arch-layer .lico svg{width:19px;height:19px}
.arch-layer .body{flex:1;min-width:0}
.arch-layer .htag{font-size:13px;color:var(--ink-2);line-height:1.5}
.arch-layer .htag b{font-family:'Poppins';font-weight:600;color:var(--ink);font-size:14px}
.arch-layer .mods{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.mod{font-size:11.5px;font-weight:500;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
.arch-layer.gov{background:#0F172A;border-color:#0F172A}
.arch-layer.gov .lico{background:rgba(255,255,255,.1);color:var(--cta)}
.arch-layer.gov .htag{color:#CBD5E1}
.arch-layer.gov .htag b{color:#fff}
.arch-layer.gov .mod{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#CBD5E1}

/* ---------- 90 day ---------- */
.phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.phase::before{content:"";position:absolute;top:0;left:0;width:100%;height:4px;background:var(--blue)}
.phase.p2::before{background:var(--blue-2)}
.phase.p3::before{background:var(--cta)}
.phase .days{font-family:'Poppins';font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.05em;margin-bottom:4px}
.phase.p3 .days{color:var(--cta)}
.phase h3{font-size:16px;margin-bottom:12px}
.phase ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.phase li{font-size:13px;color:var(--ink-2);line-height:1.45;padding-left:16px;position:relative}
.phase li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--line-2)}

/* ---------- Q&A ---------- */
.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.qa .q{display:flex;gap:10px;font-family:'Poppins';font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:8px;align-items:flex-start}
.qa .q span{color:var(--cta);font-weight:700}
.qa .a{font-size:13px;color:var(--ink-2);line-height:1.55;padding-left:22px}

/* ---------- title slide ---------- */
.hero{text-align:left}
.hero .kicker{font-family:'Poppins';font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:22px}
.hero h1{font-size:clamp(34px,5.5vw,68px);font-weight:600;line-height:1.02;margin-bottom:20px}
.hero h1 .accent{color:var(--blue)}
.hero .sub{font-size:clamp(16px,1.6vw,20px);color:var(--ink-2);max-width:680px;line-height:1.55;margin-bottom:30px}
.hero .meta{display:flex;gap:26px;flex-wrap:wrap;padding-top:24px;border-top:1px solid var(--line)}
.hero .meta div .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.hero .meta div .v{font-family:'Poppins';font-size:15px;font-weight:600;color:var(--ink)}

.agenda-item{display:flex;align-items:center;gap:16px;padding:15px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);transition:all .2s;cursor:pointer}
.agenda-item:hover{border-color:var(--blue);transform:translateX(4px)}
.agenda-item .idx{font-family:'Poppins';font-size:20px;font-weight:600;color:var(--blue);width:36px;flex-shrink:0;font-variant-numeric:tabular-nums}
.agenda-item h3{font-size:15px;font-weight:600;margin-bottom:2px}
.agenda-item p{font-size:12.5px;color:var(--ink-3)}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.section-note{font-size:12px;color:var(--ink-3);margin-top:18px;display:flex;align-items:center;gap:8px}
.section-note svg{width:15px;height:15px;color:var(--ink-3)}

.hint{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--ink-3);z-index:40;background:var(--surface);border:1px solid var(--line);padding:5px 12px;border-radius:999px;box-shadow:var(--shadow);transition:opacity .4s}
.hint b{color:var(--ink-2)}

@media (max-width:860px){
  .slide{padding:70px 6vw 80px}
  .g2,.g3,.g4,.two-col{grid-template-columns:1fr}
  .tl-steps{grid-template-columns:repeat(2,1fr);gap:22px}
  .tl-track,.tl-fill{display:none}
  .arch-layer{gap:10px}
  .arrow-h{transform:rotate(90deg)}
  .dots{display:none}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
/* ---------- uplift diagrams ---------- */
.cf{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
.cf-node{background:#0F172A;color:#fff;font-family:'Poppins';font-weight:600;font-size:14px;border-radius:12px;padding:16px 20px;flex-shrink:0}
.cf-svg{flex-shrink:0}
.cf-outs{display:flex;flex-direction:column;gap:12px}
.cf-out{border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.45;max-width:360px}
.cf-out b{font-family:'Poppins';font-weight:600;font-size:13px;display:block;margin-bottom:2px}
.cf-out.obs{background:#ECFDF5;border:1.5px solid #6EE7B7;color:#065F46}
.cf-out.obs b{color:#047857}
.cf-out.counter{background:var(--bg);border:1.5px dashed var(--line-2);color:var(--ink-3)}
.cf-out.counter b{color:var(--ink-2)}
.cf-cap{text-align:center;font-size:12px;color:var(--ink-3);font-style:italic;line-height:1.5;max-width:800px;margin:6px auto 0}
.cf-cap b{color:var(--ink-2);font-style:normal}
.mtx-title{font-family:'Poppins';font-weight:600;font-size:14px;margin:20px 0 10px;text-align:center;color:var(--ink)}
.mtx{display:grid;grid-template-columns:24px 1fr 1fr;gap:10px;align-items:stretch}
.mtx-colhead{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;text-align:center;align-self:end;padding-bottom:2px}
.mtx-rowhead{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:center}
.mtx-cell{border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px}
.mtx-cell h4{font-family:'Poppins';font-size:13.5px;font-weight:600;margin-bottom:3px;color:var(--ink)}
.mtx-cell p{font-size:12px;color:var(--ink-2);line-height:1.4}
.mtx-cell.good{background:#ECFDF5;border-color:#6EE7B7}
.mtx-cell.good h4{color:#047857}
.mtx-cell.bad{background:#FEF2F2;border-color:#FCA5A5}
.mtx-cell.bad h4{color:#B91C1C}
.mtx-cell.neutral{background:var(--bg)}
.mtx-cell.neutral h4{color:var(--ink-2)}
@media (max-width:860px){.cf-svg{transform:rotate(90deg)}.mtx{grid-template-columns:20px 1fr 1fr}}
</style>
</head>
<body>
<div id="progress"></div>
<header id="topbar">
  <div class="brand"><span class="dot"></span> PAGAYA <span class="sep">/</span> <span class="role">Lead of AI</span></div>
  <div class="counter"><b id="cur">01</b> / <span id="tot">14</span></div>
</header>

<main id="deck"><!-- slides injected as static markup below --></main>

<div class="hint" id="hint">Use <b>← →</b> arrow keys to navigate</div>

<nav id="nav">
  <div class="dots" id="dots"></div>
  <div class="arrows">
    <button id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</nav>

/* ============ ICONS (Lucide-style, inline SVG) ============ */
const I = {

  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',

  arrowR:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 16l4-5 3 3 5-7"/>',
  alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  layers:'<path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',

  <p class="cf-cap">A risk-only model can't tell these apart — it would happily poke <b>sleeping dogs</b> and spend on <b>sure things</b>. AI finds the <b>persuadables</b>. In one line: <b>ML predicts what's likely; AI decides what to do.</b></p>
</div>`);

/* ============ RENDER ============ */
const deck = document.getElementById('deck');
slides.forEach((html,i)=>{
  const s=document.createElement('section');
  s.className='slide'+(i===0?' active':'');
  s.innerHTML=html;
  deck.appendChild(s);
});

const slideEls=[...document.querySelectorAll('.slide')];
const total=slideEls.length;
let idx=0;
document.getElementById('tot').textContent=String(total).padStart(2,'0');

const dots=document.getElementById('dots');
slideEls.forEach((_,i)=>{
  const b=document.createElement('button');
  b.setAttribute('aria-label','Go to slide '+(i+1));
  if(i===0)b.classList.add('on');
  b.addEventListener('click',()=>go(i));
  dots.appendChild(b);
});
const dotEls=[...dots.children];
const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
const progress=document.getElementById('progress'), hint=document.getElementById('hint');

function go(n){
  n=Math.max(0,Math.min(total-1,n));
  if(n===idx)return;
  slideEls[idx].classList.remove('active');
  slideEls[idx].classList.toggle('prev', n>idx);
  slideEls[n].classList.remove('prev');
  slideEls[n].classList.add('active');
  dotEls[idx].classList.remove('on');
  dotEls[n].classList.add('on');
  idx=n;
  update();
}
function update(){
  document.getElementById('cur').textContent=String(idx+1).padStart(2,'0');
  progress.style.width=((idx)/(total-1)*100)+'%';
  prevBtn.disabled=idx===0;
  nextBtn.disabled=idx===total-1;
  if(idx>0&&hint){hint.style.opacity='0';}
}
prevBtn.addEventListener('click',()=>go(idx-1));
nextBtn.addEventListener('click',()=>go(idx+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(idx+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(idx-1);}
  else if(e.key==='Home'){go(0);}
  else if(e.key==='End'){go(total-1);}
});
deck.addEventListener('click',e=>{
  const a=e.target.closest('[data-go]');
  if(a)go(parseInt(a.dataset.go,10));
});
// swipe
let x0=null;
deck.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
deck.addEventListener('touchend',e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0;
  if(Math.abs(dx)>50)go(idx+(dx<0?1:-1));
  x0=null;
});
update();
</script>
