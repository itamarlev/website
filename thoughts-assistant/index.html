<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>המחשבות שלי</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 data-i18n="title">המחשבות שלי</h1>
      <div class="sub" data-i18n="subtitle">לזכור, לתזמן, ולחזור למה שחשוב</div>
    </div>
    <button id="langBtn" class="lang" aria-label="Switch language">EN</button>
  </header>

  <section class="composer">
    <div class="composer-row">
      <textarea id="thoughtInput" placeholder="מה עובר לך בראש?" data-i18n-placeholder="placeholder"></textarea>
      <button id="voiceBtn" class="icon-btn" title="הכתבה קולית" aria-label="הכתבה קולית">🎙</button>
    </div>
    <div class="field" style="margin-top:12px">
      <label for="newType" data-i18n="itemType">סוג פריט</label>
      <select id="newType">
        <option value="thought" data-i18n="typeThought">מחשבה / משימה</option>
        <option value="friend" data-i18n="typeFriend">חבר / אדם</option>
      </select>
    </div>
    <div class="composer-actions">
      <button id="scheduleNewBtn" class="btn secondary" data-i18n="schedule">תזמון</button>
      <button id="addBtn" class="btn primary" data-i18n="add">הוספה</button>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-filter="active" data-i18n="active">פעילות</button>
    <button class="tab" data-filter="archived" data-i18n="archived">ארכיון</button>
    <button class="tab" data-filter="all" data-i18n="all">הכול</button>
  </div>

  <div id="dueBar" class="due-bar"><strong id="dueSummary"></strong><button id="showDueBtn" type="button" data-i18n="showReminders">הצג תזכורות</button></div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty hidden" data-i18n="empty">אין כאן מחשבות כרגע.</div>

  <div class="transfer-row"><button id="transferBtn" class="transfer-btn" type="button" data-i18n="transferToSite">העבר לאתר</button></div>
  <div class="footer-hint" data-i18n="savedLocal">המידע נשמר מקומית במכשיר הזה.</div>
</div>

<dialog id="scheduleDialog">
  <form method="dialog" class="modal" id="scheduleForm">
    <h2 data-i18n="scheduleTitle">תזמון</h2>
    <div class="grid2">
      <div class="field">
        <label for="scheduleDate" data-i18n="date">תאריך</label>
        <input id="scheduleDate" type="date">
      </div>
      <div class="field">
        <label for="scheduleTime" data-i18n="time">שעה</label>
        <input id="scheduleTime" type="time">
      </div>
    </div>

    <div class="field">
      <label for="repeatSelect" data-i18n="repeat">חזרה</label>
      <select id="repeatSelect">
        <option value="none" data-i18n="repeatNone">ללא חזרה</option>
        <option value="weekly" data-i18n="repeatWeekly">פעם בשבוע</option>
        <option value="biweekly" data-i18n="repeatBiweekly">פעם בשבועיים</option>
        <option value="monthly" data-i18n="repeatMonthly">פעם בחודש</option>
        <option value="bimonthly" data-i18n="repeatBimonthly">פעם בחודשיים</option>
      </select>
    </div>

    <div class="switch-row">
      <div>
        <div style="font-weight:700" data-i18n="randomize">תזכורת אקראית</div>
        <div class="sub" data-i18n="randomizeHelp">תופיע שוב במועד אקראי לפי התדירות</div>
      </div>
      <input id="randomEnabled" type="checkbox" aria-label="Random reminder">
    </div>

    <div id="randomFrequencyWrap" class="field hidden">
      <label for="randomFrequency" data-i18n="frequency">תדירות אקראית</label>
      <select id="randomFrequency">
        <option value="daily" data-i18n="randomDaily">פעם ביום</option>
        <option value="3days" data-i18n="random3Days">פעם בשלושה ימים</option>
        <option value="weekly" data-i18n="randomWeekly">פעם בשבוע</option>
        <option value="biweekly" data-i18n="randomBiweekly">פעם בשבועיים</option>
      </select>
    </div>

    <div class="modal-actions">
      <button type="button" id="clearScheduleBtn" class="btn ghost" data-i18n="clear">נקה תזמון</button>
      <button type="submit" id="saveScheduleBtn" class="btn primary" data-i18n="save">שמור</button>
    </div>
  </form>
</dialog>

<dialog id="editDialog">
  <form method="dialog" class="modal" id="editForm">
    <h2 data-i18n="editTitle">עריכת מחשבה</h2>
    <div class="field">
      <label for="editType" data-i18n="itemType">סוג פריט</label>
      <select id="editType">
        <option value="thought" data-i18n="typeThought">מחשבה / משימה</option>
        <option value="friend" data-i18n="typeFriend">חבר / אדם</option>
      </select>
    </div>
    <div class="field">
      <label for="editText" data-i18n="thought">תוכן</label>
      <textarea id="editText" style="min-height:120px"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" id="editScheduleBtn" class="btn secondary" data-i18n="editSchedule">שינוי תזמון</button>
      <button type="submit" class="btn primary" data-i18n="saveChanges">שמירת שינויים</button>
    </div>
  </form>
</dialog>

<dialog id="dueDialog">
  <div class="modal">
    <h2 data-i18n="dueListTitle">התזכורות שמחכות לך</h2>
    <div id="dueList" class="list"></div>
    <div class="modal-actions"><button id="closeDueBtn" class="btn ghost" data-i18n="close">סגור</button></div>
  </div>
</dialog>

<dialog id="deleteDialog">
  <div class="modal">
    <h2 data-i18n="deleteTitle">למחוק את המחשבה?</h2>
    <div class="sub" data-i18n="deleteHelp">המחיקה היא סופית. אפשר לבחור בארכיון אם אולי תרצה לחזור אליה.</div>
    <div class="modal-actions">
      <button id="cancelDeleteBtn" class="btn ghost" data-i18n="cancel">ביטול</button>
      <button id="confirmDeleteBtn" class="btn danger" data-i18n="delete">מחיקה</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
