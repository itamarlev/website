<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>המחשבות שלי | itamarlev.com</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2430;--muted:#6c7280;--line:#e6e8ef;--primary:#4f5bd5;--soft:#eef0ff;--danger:#b42318;--dangerSoft:#fff1f0;--ok:#18794e;--okSoft:#edf9f2;--shadow:0 10px 30px rgba(31,36,48,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:16px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.topActions{display:flex;gap:8px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;color:var(--ink);text-decoration:none}h1{font-size:30px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:5px}.box,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.box{padding:16px;margin-bottom:16px}.composer{display:flex;gap:10px}.composer textarea{flex:1}.voice{min-width:48px;border:1px solid var(--line);border-radius:15px;background:#fff}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;color:var(--ink);outline:none}textarea{min-height:76px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:#aab0ef;box-shadow:0 0 0 3px var(--soft)}.row{display:flex;gap:10px}.actions{margin-top:10px}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:700;min-height:44px}.primary{background:var(--primary);color:#fff;flex:1}.secondary{background:var(--soft);color:#4149a8}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:var(--dangerSoft);color:var(--danger)}.tabs{display:flex;gap:8px;margin:12px 0}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 13px}.tab.active{background:var(--soft);color:#4149a8;font-weight:700}.list{display:grid;gap:12px}.card{padding:15px}.cardTop{display:flex;justify-content:space-between;gap:10px}.thought{font-size:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.menu{border:0;background:#f4f5f8;border-radius:11px;min-width:40px;height:40px;font-size:20px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{font-size:12px;border-radius:999px;padding:6px 9px;background:#f2f3f7;color:#5f6572}.chip.repeat{background:var(--soft);color:#4149a8}.chip.random{background:#f2edff;color:#6a42a6}.chip.due{background:#fff2e7;color:#9a4f00}.chip.done{background:var(--okSoft);color:var(--ok)}.cardActions{display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.card.open .cardActions{display:grid}.small{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 7px;font-size:13px}.small.delete{color:var(--danger);background:#fffafa}.meta{font-size:12px;color:var(--muted);margin-top:8px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #d7dae3;border-radius:18px;background:#fff}.hidden{display:none!important}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}dialog{width:min(94vw,560px);border:0;border-radius:22px;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(21,25,35,.38)}.modal{padding:20px}.modal h2{margin:0 0 16px}.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-weight:700;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:13px}.switch input{width:22px;height:22px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222733;color:#fff;padding:10px 14px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:10}.toast.show{opacity:1}@media(max-width:520px){h1{font-size:26px}.cardActions{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.top{align-items:flex-start}.topActions{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1 data-t="title">המחשבות שלי</h1><div class="sub" data-t="subtitle">לזכור, לתזמן, ולחזור למה שחשוב</div></div>
    <div class="topActions"><a class="pill" href="/" data-t="home">דף הבית</a><button id="lang" class="pill">EN</button></div>
  </div>

  <section class="box">
    <div class="composer"><textarea id="newText" data-ph="placeholder" placeholder="מה עובר לך בראש?"></textarea><button id="voice" class="voice" aria-label="Voice input">🎙</button></div>
    <div class="row actions"><button id="scheduleNew" class="btn secondary" data-t="schedule">תזמון</button><button id="add" class="btn primary" data-t="add">הוספה</button></div>
  </section>

  <div class="tabs"><button class="tab active" data-filter="active" data-t="active">פעילות</button><button class="tab" data-filter="archived" data-t="archived">ארכיון</button><button class="tab" data-filter="all" data-t="all">הכול</button></div>
  <div id="list" class="list"></div><div id="empty" class="empty hidden" data-t="empty">אין כאן מחשבות כרגע.</div>
  <div class="hint" data-t="local">המידע נשמר מקומית בדפדפן במכשיר הזה.</div>
</div>

<dialog id="scheduleDlg"><form id="scheduleForm" class="modal">
  <h2 data-t="scheduleTitle">תזמון</h2>
  <div class="grid2"><div class="field"><label data-t="date">תאריך</label><input id="date" type="date"></div><div class="field"><label data-t="time">שעה</label><input id="time" type="time"></div></div>
  <div class="field"><label data-t="repeat">חזרה</label><select id="repeat"><option value="none" data-t="none">ללא חזרה</option><option value="weekly" data-t="weekly">פעם בשבוע</option><option value="biweekly" data-t="biweekly">פעם בשבועיים</option><option value="monthly" data-t="monthly">פעם בחודש</option><option value="bimonthly" data-t="bimonthly">פעם בחודשיים</option></select></div>
  <div class="switch"><div><strong data-t="random">תזכורת אקראית</strong><div class="sub" data-t="randomHelp">מועד אקראי נוסף לפי התדירות</div></div><input id="randomOn" type="checkbox"></div>
  <div id="randomWrap" class="field hidden"><label data-t="frequency">תדירות</label><select id="frequency"><option value="daily" data-t="daily">פעם ביום</option><option value="3days" data-t="threeDays">פעם בשלושה ימים</option><option value="weekly" data-t="weekly">פעם בשבוע</option><option value="biweekly" data-t="biweekly">פעם בשבועיים</option></select></div>
  <div class="row"><button type="button" id="clearSchedule" class="btn ghost" data-t="clear">נקה תזמון</button><button class="btn primary" data-t="save">שמור</button></div>
</form></dialog>

<dialog id="editDlg"><form id="editForm" class="modal"><h2 data-t="editTitle">עריכת מחשבה</h2><div class="field"><textarea id="editText"></textarea></div><div class="row"><button type="button" id="editSchedule" class="btn secondary" data-t="changeSchedule">שינוי תזמון</button><button class="btn primary" data-t="saveChanges">שמירת שינויים</button></div></form></dialog>

<dialog id="deleteDlg"><div class="modal"><h2 data-t="deleteTitle">למחוק את המחשבה?</h2><p class="sub" data-t="deleteHelp">המחיקה סופית. אפשר להעביר לארכיון במקום.</p><div class="row"><button id="cancelDelete" class="btn ghost" data-t="cancel">ביטול</button><button id="confirmDelete" class="btn danger" data-t="delete">מחיקה</button></div></div></dialog>
<div id="toast" class="toast"></div>

<script>
(()=>{
const KEY='thoughts_assistant_v1';
const L={
he:{title:'המחשבות שלי',subtitle:'לזכור, לתזמן, ולחזור למה שחשוב',home:'דף הבית',placeholder:'מה עובר לך בראש?',schedule:'תזמון',add:'הוספה',active:'פעילות',archived:'ארכיון',all:'הכול',empty:'אין כאן מחשבות כרגע.',local:'המידע נשמר מקומית בדפדפן במכשיר הזה.',scheduleTitle:'תזמון',date:'תאריך',time:'שעה',repeat:'חזרה',none:'ללא חזרה',weekly:'פעם בשבוע',biweekly:'פעם בשבועיים',monthly:'פעם בחודש',bimonthly:'פעם בחודשיים',random:'תזכורת אקראית',randomHelp:'מועד אקראי נוסף לפי התדירות',frequency:'תדירות',daily:'פעם ביום',threeDays:'פעם בשלושה ימים',clear:'נקה תזמון',save:'שמור',editTitle:'עריכת מחשבה',changeSchedule:'שינוי תזמון',saveChanges:'שמירת שינויים',deleteTitle:'למחוק את המחשבה?',deleteHelp:'המחיקה סופית. אפשר להעביר לארכיון במקום.',cancel:'ביטול',delete:'מחיקה',edit:'עריכה',archive:'ארכיון',restore:'החזרה',done:'בוצע',scheduled:'מתוזמן',repeats:'חוזר',due:'הגיע הזמן',randomChip:'אקראי',added:'המחשבה נוספה',updated:'המחשבה עודכנה',deleted:'המחשבה נמחקה',archivedToast:'הועבר לארכיון',restoredToast:'הוחזר מהארכיון',next:'המועד הבא נקבע אוטומטית',writeFirst:'צריך לכתוב משהו קודם',voiceNo:'הכתבה קולית אינה נתמכת בדפדפן הזה'},
en:{title:'My Thoughts',subtitle:'Remember, schedule, and return to what matters',home:'Home',placeholder:'What is on your mind?',schedule:'Schedule',add:'Add',active:'Active',archived:'Archive',all:'All',empty:'No thoughts here right now.',local:'Data is stored locally in this browser on this device.',scheduleTitle:'Schedule',date:'Date',time:'Time',repeat:'Repeat',none:'No repeat',weekly:'Once a week',biweekly:'Every two weeks',monthly:'Once a month',bimonthly:'Every two months',random:'Random reminder',randomHelp:'An additional random time based on frequency',frequency:'Frequency',daily:'Once a day',threeDays:'Every three days',clear:'Clear schedule',save:'Save',editTitle:'Edit thought',changeSchedule:'Change schedule',saveChanges:'Save changes',deleteTitle:'Delete this thought?',deleteHelp:'Deletion is permanent. Archive it instead if you may want it later.',cancel:'Cancel',delete:'Delete',edit:'Edit',archive:'Archive',restore:'Restore',done:'Done',scheduled:'Scheduled',repeats:'Repeats',due:'Due now',randomChip:'Random',added:'Thought added',updated:'Thought updated',deleted:'Thought deleted',archivedToast:'Moved to archive',restoredToast:'Restored',next:'Next occurrence scheduled automatically',writeFirst:'Write something first',voiceNo:'Voice input is not supported in this browser'}
};
const $=id=>document.getElementById(id),S={items:[],filter:'active',lang:localStorage.getItem('thoughts_lang')||'he',pending:null,target:null,edit:null,del:null};
const t=k=>L[S.lang][k]||k,save=()=>localStorage.setItem(KEY,JSON.stringify(S.items));
function load(){try{S.items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(S.items))S.items=[]}catch{S.items=[]}}
function toast(x){const e=$('toast');e.textContent=x;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),1600)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function lang(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='he'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));$('lang').textContent=S.lang==='he'?'EN':'עברית';render()}
function iso(s){if(!s?.date||!s?.time)return null;const d=new Date(`${s.date}T${s.time}:00`);return isNaN(d)?null:d.toISOString()}
function fmt(x){if(!x)return'';return new Intl.DateTimeFormat(S.lang==='he'?'he-IL':'en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(x))}
function repeatText(v){return t(v||'none')}
function freqText(v){return v==='3days'?t('threeDays'):t(v||'daily')}
function rndMs(v){return({daily:86400000,'3days':259200000,weekly:604800000,biweekly:1209600000})[v]||86400000}
function nextRandom(v){const span=rndMs(v),min=Math.min(7200000,span*.15);return new Date(Date.now()+min+Math.random()*(span-min)).toISOString()}
function due(i){const a=iso(i.schedule),b=i.random?.enabled?i.random.nextAt:null;return !!((a&&new Date(a)<=new Date())||(b&&new Date(b)<=new Date()))}
function addMonths(d,n){const day=d.getDate();d=new Date(d);d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d}
function nextDate(d,r){d=new Date(d);if(r==='weekly')d.setDate(d.getDate()+7);else if(r==='biweekly')d.setDate(d.getDate()+14);else if(r==='monthly')d=addMonths(d,1);else if(r==='bimonthly')d=addMonths(d,2);return d}
function render(){const a=S.items.filter(i=>S.filter==='all'||(S.filter==='active'?!i.archived:i.archived)).sort((x,y)=>(due(x)?0:1)-(due(y)?0:1)||new Date(y.createdAt)-new Date(x.createdAt));$('list').innerHTML='';$('empty').classList.toggle('hidden',!!a.length);a.forEach(i=>{const c=document.createElement('article');c.className='card';c.dataset.id=i.id;const chips=[];const si=iso(i.schedule);if(due(i))chips.push(`<span class="chip due">${esc(t('due'))}</span>`);if(si)chips.push(`<span class="chip">${esc(t('scheduled'))}: ${esc(fmt(si))}</span>`);if(i.schedule?.repeat&&i.schedule.repeat!=='none')chips.push(`<span class="chip repeat">${esc(t('repeats'))}: ${esc(repeatText(i.schedule.repeat))}</span>`);if(i.random?.enabled)chips.push(`<span class="chip random">${esc(t('randomChip'))}: ${esc(freqText(i.random.frequency))}</span>`);if(i.done)chips.push(`<span class="chip done">${esc(t('done'))}</span>`);c.innerHTML=`<div class="cardTop"><div style="flex:1"><div class="thought">${esc(i.text)}</div><div class="chips">${chips.join('')}</div></div><button class="menu">⋯</button></div><div class="cardActions"><button class="small edit">${esc(t('edit'))}</button><button class="small complete">${esc(t('done'))}</button><button class="small archive">${esc(i.archived?t('restore'):t('archive'))}</button><button class="small delete">${esc(t('delete'))}</button></div><div class="meta">${esc(fmt(i.createdAt))}</div>`;$('list').appendChild(c)})}
function openSchedule(id=null){S.target=id;const i=id?S.items.find(x=>x.id===id):null,v=i||S.pending||{};const s=v.schedule||{},r=v.random||{};const now=new Date(),p=n=>String(n).padStart(2,'0');$('date').value=s.date||`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}`;$('time').value=s.time||`${p(Math.min(23,now.getHours()+1))}:00`;$('repeat').value=s.repeat||'none';$('randomOn').checked=!!r.enabled;$('frequency').value=r.frequency||'daily';$('randomWrap').classList.toggle('hidden',!r.enabled);$('scheduleDlg').showModal()}
function scheduleValue(){const schedule=$('date').value&&$('time').value?{date:$('date').value,time:$('time').value,repeat:$('repeat').value}:null;const random=$('randomOn').checked?{enabled:true,frequency:$('frequency').value,nextAt:nextRandom($('frequency').value)}:null;return{schedule,random}}
function advance(i){const r=i.schedule?.repeat,si=iso(i.schedule);if(si&&r&&r!=='none'){let n=nextDate(new Date(si),r);while(n<=new Date())n=nextDate(n,r);const p=x=>String(x).padStart(2,'0');i.schedule.date=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;i.schedule.time=`${p(n.getHours())}:${p(n.getMinutes())}`;i.done=false;if(i.random?.enabled)i.random.nextAt=nextRandom(i.random.frequency);toast(t('next'))}else i.done=true}
$('add').onclick=()=>{const text=$('newText').value.trim();if(!text)return toast(t('writeFirst'));const v=S.pending||{};S.items.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36),text,createdAt:new Date().toISOString(),archived:false,done:false,schedule:v.schedule||null,random:v.random||null});$('newText').value='';S.pending=null;save();render();toast(t('added'))};
$('scheduleNew').onclick=()=>openSchedule();$('randomOn').onchange=()=>$('randomWrap').classList.toggle('hidden',!$('randomOn').checked);
$('scheduleForm').onsubmit=e=>{e.preventDefault();const v=scheduleValue();if(S.target){const i=S.items.find(x=>x.id===S.target);if(i){i.schedule=v.schedule;i.random=v.random;i.done=false}}else S.pending=v;save();render();S.target=null;$('scheduleDlg').close();toast(t('updated'))};
$('clearSchedule').onclick=()=>{if(S.target){const i=S.items.find(x=>x.id===S.target);if(i){i.schedule=null;i.random=null}}else S.pending=null;save();render();S.target=null;$('scheduleDlg').close()};
$('list').onclick=e=>{const c=e.target.closest('.card');if(!c)return;const i=S.items.find(x=>x.id===c.dataset.id);if(e.target.closest('.menu'))return c.classList.toggle('open');if(e.target.closest('.edit')){S.edit=i.id;$('editText').value=i.text;return $('editDlg').showModal()}if(e.target.closest('.complete')){advance(i);save();render();return}if(e.target.closest('.archive')){i.archived=!i.archived;save();render();return toast(i.archived?t('archivedToast'):t('restoredToast'))}if(e.target.closest('.delete')){S.del=i.id;return $('deleteDlg').showModal()}};
$('editForm').onsubmit=e=>{e.preventDefault();const i=S.items.find(x=>x.id===S.edit),v=$('editText').value.trim();if(i&&v){i.text=v;save();render();toast(t('updated'))}S.edit=null;$('editDlg').close()};
$('editSchedule').onclick=()=>{const id=S.edit;$('editDlg').close();openSchedule(id)};$('cancelDelete').onclick=()=>{S.del=null;$('deleteDlg').close()};$('confirmDelete').onclick=()=>{S.items=S.items.filter(x=>x.id!==S.del);S.del=null;save();render();$('deleteDlg').close();toast(t('deleted'))};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.filter=b.dataset.filter;render()});
$('lang').onclick=()=>{S.lang=S.lang==='he'?'en':'he';localStorage.setItem('thoughts_lang',S.lang);lang()};
$('voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast(t('voiceNo'));const r=new R();r.lang=S.lang==='he'?'he-IL':'en-US';r.onresult=e=>$('newText').value=($('newText').value+' '+e.results[0][0].transcript).trim();r.start()};
function checkRandom(){let changed=false;S.items.forEach(i=>{if(!i.archived&&i.random?.enabled&&i.random.nextAt&&new Date(i.random.nextAt)<=new Date()){if('Notification'in window&&Notification.permission==='granted')try{new Notification(S.lang==='he'?'תזכורת מהמחשבות':'Thought reminder',{body:i.text})}catch{}i.random.nextAt=nextRandom(i.random.frequency);changed=true}});if(changed){save();render()}}
load();lang();checkRandom();setInterval(checkRandom,60000);
})();
</script>
</body>
</html>
