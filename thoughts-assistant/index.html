<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>המחשבות שלי</title>
  <style>
:root{
  --bg:#f2f4f8;--surface:rgba(255,255,255,.86);--surface-solid:#fff;--ink:#111318;--muted:#707782;
  --line:rgba(17,19,24,.08);--line-strong:rgba(17,19,24,.13);--primary:#5b5ce2;--primary-2:#7c66ff;
  --primary-soft:#efefff;--friend:#117a65;--friend-soft:#e9f8f3;--due:#d45d37;--due-soft:#fff0e9;
  --danger:#bb2d3b;--danger-soft:#fff0f2;--success:#237a4b;--success-soft:#edf8f1;
  --shadow-sm:0 1px 2px rgba(16,24,40,.03),0 6px 18px rgba(16,24,40,.05);
  --shadow-md:0 20px 55px rgba(28,35,48,.12);--radius:24px;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;
  background:
    radial-gradient(circle at 85% -10%,rgba(91,92,226,.18),transparent 34rem),
    radial-gradient(circle at 5% 18%,rgba(17,122,101,.10),transparent 28rem),
    linear-gradient(180deg,#f8f9fc 0,#f2f4f8 38%,#eef1f5 100%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(91,92,226,.22);outline-offset:2px
}
.app{width:min(820px,100%);margin:0 auto;padding:0 18px max(120px,calc(90px + env(safe-area-inset-bottom)))}
header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin:0 -18px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  background:rgba(248,249,252,.74);backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);border-bottom:1px solid rgba(17,19,24,.05)
}
header>div:first-child{min-width:0}
h1{font-size:clamp(27px,6vw,38px);line-height:1.04;margin:0;letter-spacing:-.045em;font-weight:780}
.sub{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.35}
.lang{
  flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:999px;
  min-width:48px;height:42px;padding:0 13px;color:var(--ink);font-size:12px;font-weight:800;
  box-shadow:0 2px 10px rgba(17,19,24,.04)
}
.composer{
  position:relative;overflow:hidden;margin:28px 0 22px;padding:17px;border:1px solid rgba(255,255,255,.8);
  border-radius:30px;background:rgba(255,255,255,.82);box-shadow:var(--shadow-md);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)
}
.composer:before{
  content:"";position:absolute;inset:-100px auto auto -80px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,92,226,.14),transparent 68%);pointer-events:none
}
.composer-row{position:relative;display:flex;gap:10px;align-items:stretch}
textarea{
  flex:1;min-height:108px;resize:vertical;border:0;border-radius:21px;padding:16px 17px;
  background:#f5f6fa;color:var(--ink);outline:none;font-size:17px;line-height:1.48;box-shadow:inset 0 0 0 1px rgba(17,19,24,.035)
}
textarea::placeholder{color:#9ba1aa}
.icon-btn{
  min-width:56px;width:56px;border:0;border-radius:19px;background:#161922;color:#fff;
  font-size:21px;box-shadow:0 10px 24px rgba(17,19,24,.16);transition:.18s transform,.18s box-shadow
}
.icon-btn:active{transform:scale(.96);box-shadow:0 5px 14px rgba(17,19,24,.13)}
.field{display:grid;gap:7px;margin-bottom:14px}
.composer>.field{position:relative;margin:13px 0 0}
label{font-size:12px;font-weight:760;color:#5f6670}
input,select{
  width:100%;min-height:46px;border:1px solid var(--line);border-radius:15px;padding:0 13px;background:#fff;color:var(--ink);outline:none
}
.composer select{background:#f7f8fb;border-color:transparent;font-weight:700}
.composer-actions{position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:12px}
.btn{
  border:0;border-radius:16px;padding:0 17px;font-weight:780;min-height:50px;transition:.16s transform,.16s filter
}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 10px 24px rgba(91,92,226,.24)}
.btn.secondary{background:var(--primary-soft);color:#494bb8}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.tabs{
  position:sticky;top:84px;z-index:35;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  margin:0 0 16px;padding:4px;border-radius:17px;background:rgba(228,231,238,.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.tab{
  border:0;border-radius:13px;padding:10px 8px;background:transparent;color:#6d7480;font-size:13px;font-weight:720
}
.tab.active{background:#fff;color:#171a20;box-shadow:0 2px 9px rgba(17,19,24,.08)}
.due-bar{
  display:none;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;padding:14px 15px;
  border:1px solid rgba(212,93,55,.16);background:linear-gradient(135deg,#fff7f2,#fff0e8);border-radius:19px;
  box-shadow:0 8px 24px rgba(212,93,55,.07)
}
.due-bar.show{display:flex}
.due-bar strong{font-size:14px;color:#82452f}
.due-bar button{border:0;background:#fff;border-radius:12px;padding:9px 12px;font-weight:780;color:#a14c31;box-shadow:0 4px 12px rgba(120,58,36,.08)}
.list{display:grid;gap:12px}
.card{
  position:relative;overflow:hidden;background:rgba(255,255,255,.90);border:1px solid rgba(255,255,255,.92);
  border-radius:23px;padding:16px;box-shadow:var(--shadow-sm);transition:.18s transform,.18s box-shadow,.18s border-color
}
.card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:#c6cad2;opacity:.65}
.card.friend-card:before{background:var(--friend);opacity:1}
.card.due-card{border-color:rgba(212,93,55,.18);box-shadow:0 8px 28px rgba(212,93,55,.08)}
.card.due-card:before{background:var(--due);opacity:1}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.thought{font-size:17px;font-weight:650;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;letter-spacing:-.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.chip{
  display:inline-flex;align-items:center;min-height:28px;border-radius:999px;padding:5px 9px;
  background:#f1f3f6;color:#606873;font-size:11px;font-weight:700
}
.chip.due{background:var(--due-soft);color:#a04c31}
.chip.repeat{background:var(--primary-soft);color:#5052b6}
.chip.random{background:#f5efff;color:#6a4aa5}
.chip.done{background:var(--success-soft);color:var(--success)}
.chip.friend{background:var(--friend-soft);color:var(--friend)}
.actions{
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)
}
.small-action{
  position:relative;min-height:40px;border:0;background:#f6f7f9;border-radius:12px;padding:8px 7px;
  color:#58606b;font-size:11px;font-weight:780
}
.small-action.edit{color:#4446ad;background:#f1f1ff}
.small-action.delete{color:var(--danger);background:#fff3f4}
.small-action.complete{color:var(--success);background:#eff8f2}
.small-action.archive{color:#5f6670;background:#f2f3f5}
.meta{font-size:10px;color:#9ca2aa;margin-top:10px}
.empty{
  padding:52px 22px;text-align:center;color:var(--muted);border:1px dashed rgba(17,19,24,.12);
  border-radius:24px;background:rgba(255,255,255,.68)
}
.empty:before{content:"✓";display:grid;place-items:center;width:50px;height:50px;margin:0 auto 12px;border-radius:18px;background:#fff;color:var(--success);font-size:22px;box-shadow:var(--shadow-sm)}
.transfer-row{display:flex;justify-content:center;margin-top:24px}
.transfer-btn{
  border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:14px;padding:10px 14px;color:var(--ink);font-weight:700
}
.footer-hint{color:#979ea7;font-size:11px;text-align:center;margin-top:14px}
dialog{
  width:min(94vw,560px);border:0;border-radius:28px;padding:0;background:#fff;
  box-shadow:0 34px 100px rgba(15,18,25,.28)
}
dialog::backdrop{background:rgba(12,15,22,.44);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal{padding:22px}
.modal h2{margin:0 0 18px;font-size:24px;letter-spacing:-.025em}
.modal .sub{font-size:13px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  border:1px solid var(--line);border-radius:17px;padding:13px 14px;margin-bottom:14px;background:#fafbfc
}
.switch-row input{width:24px;height:24px;accent-color:var(--primary)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}
.hidden{display:none!important}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:1000;opacity:0;pointer-events:none;background:#161922;color:#fff;border:1px solid rgba(255,255,255,.08);
  border-radius:999px;padding:12px 16px;box-shadow:0 16px 40px rgba(16,18,25,.24);transition:.22s;white-space:nowrap;font-size:13px
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(hover:hover){
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(25,32,44,.09)}
  .lang:hover,.transfer-btn:hover{background:#fff}
}
@media(max-width:560px){
  .app{padding-inline:12px}
  header{margin-inline:-12px;padding-inline:14px}
  .composer{margin-top:18px;padding:13px;border-radius:25px}
  .composer-row{gap:8px}
  textarea{min-height:96px;font-size:16px}
  .icon-btn{width:52px;min-width:52px;border-radius:17px}
  .tabs{top:78px}
  .actions{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .due-bar{align-items:flex-start}
}
@media(max-width:380px){
  .composer-actions{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr 1fr}
  .tab{font-size:12px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 data-i18n="title">המחשבות שלי</h1>
      <div class="sub" data-i18n="subtitle">לזכור, לתזמן, ולחזור למה שחשוב</div>
    </div>
    <button id="langBtn" class="lang" aria-label="Switch language">EN</button>
  </header>

  <section class="composer">
    <div class="composer-row">
      <textarea id="thoughtInput" placeholder="מה עובר לך בראש?" data-i18n-placeholder="placeholder"></textarea>
      <button id="voiceBtn" class="icon-btn" title="הכתבה קולית" aria-label="הכתבה קולית">🎙</button>
    </div>
    <div class="field" style="margin-top:12px">
      <label for="newType" data-i18n="itemType">סוג פריט</label>
      <select id="newType">
        <option value="thought" data-i18n="typeThought">מחשבה / משימה</option>
        <option value="friend" data-i18n="typeFriend">חבר / אדם</option>
      </select>
    </div>
    <div class="composer-actions">
      <button id="scheduleNewBtn" class="btn secondary" data-i18n="schedule">תזמון</button>
      <button id="addBtn" class="btn primary" data-i18n="add">הוספה</button>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-filter="active" data-i18n="active">פעילות</button>
    <button class="tab" data-filter="archived" data-i18n="archived">ארכיון</button>
    <button class="tab" data-filter="all" data-i18n="all">הכול</button>
  </div>

  <div id="dueBar" class="due-bar"><strong id="dueSummary"></strong><button id="showDueBtn" type="button" data-i18n="showReminders">הצג תזכורות</button></div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty hidden" data-i18n="empty">אין כאן מחשבות כרגע.</div>

  <div class="transfer-row"><button id="transferBtn" class="transfer-btn" type="button" data-i18n="transferToSite">העבר לאתר</button></div>
  <div class="footer-hint" data-i18n="savedLocal">המידע נשמר מקומית במכשיר הזה.</div>
</div>

<dialog id="scheduleDialog">
  <form method="dialog" class="modal" id="scheduleForm">
    <h2 data-i18n="scheduleTitle">תזמון</h2>
    <div class="grid2">
      <div class="field">
        <label for="scheduleDate" data-i18n="date">תאריך</label>
        <input id="scheduleDate" type="date">
      </div>
      <div class="field">
        <label for="scheduleTime" data-i18n="time">שעה</label>
        <input id="scheduleTime" type="time">
      </div>
    </div>

    <div class="field">
      <label for="repeatSelect" data-i18n="repeat">חזרה</label>
      <select id="repeatSelect">
        <option value="none" data-i18n="repeatNone">ללא חזרה</option>
        <option value="weekly" data-i18n="repeatWeekly">פעם בשבוע</option>
        <option value="biweekly" data-i18n="repeatBiweekly">פעם בשבועיים</option>
        <option value="monthly" data-i18n="repeatMonthly">פעם בחודש</option>
        <option value="bimonthly" data-i18n="repeatBimonthly">פעם בחודשיים</option>
      </select>
    </div>

    <div class="switch-row">
      <div>
        <div style="font-weight:700" data-i18n="randomize">תזכורת אקראית</div>
        <div class="sub" data-i18n="randomizeHelp">תופיע שוב במועד אקראי לפי התדירות</div>
      </div>
      <input id="randomEnabled" type="checkbox" aria-label="Random reminder">
    </div>

    <div id="randomFrequencyWrap" class="field hidden">
      <label for="randomFrequency" data-i18n="frequency">תדירות אקראית</label>
      <select id="randomFrequency">
        <option value="daily" data-i18n="randomDaily">פעם ביום</option>
        <option value="3days" data-i18n="random3Days">פעם בשלושה ימים</option>
        <option value="weekly" data-i18n="randomWeekly">פעם בשבוע</option>
        <option value="biweekly" data-i18n="randomBiweekly">פעם בשבועיים</option>
      </select>
    </div>

    <div class="modal-actions">
      <button type="button" id="clearScheduleBtn" class="btn ghost" data-i18n="clear">נקה תזמון</button>
      <button type="submit" id="saveScheduleBtn" class="btn primary" data-i18n="save">שמור</button>
    </div>
  </form>
</dialog>

<dialog id="editDialog">
  <form method="dialog" class="modal" id="editForm">
    <h2 data-i18n="editTitle">עריכת מחשבה</h2>
    <div class="field">
      <label for="editType" data-i18n="itemType">סוג פריט</label>
      <select id="editType">
        <option value="thought" data-i18n="typeThought">מחשבה / משימה</option>
        <option value="friend" data-i18n="typeFriend">חבר / אדם</option>
      </select>
    </div>
    <div class="field">
      <label for="editText" data-i18n="thought">תוכן</label>
      <textarea id="editText" style="min-height:120px"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" id="editScheduleBtn" class="btn secondary" data-i18n="editSchedule">שינוי תזמון</button>
      <button type="submit" class="btn primary" data-i18n="saveChanges">שמירת שינויים</button>
    </div>
  </form>
</dialog>

<dialog id="dueDialog">
  <div class="modal">
    <h2 data-i18n="dueListTitle">התזכורות שמחכות לך</h2>
    <div id="dueList" class="list"></div>
    <div class="modal-actions"><button id="closeDueBtn" class="btn ghost" data-i18n="close">סגור</button></div>
  </div>
</dialog>

<dialog id="deleteDialog">
  <div class="modal">
    <h2 data-i18n="deleteTitle">למחוק את המחשבה?</h2>
    <div class="sub" data-i18n="deleteHelp">המחיקה היא סופית. אפשר לבחור בארכיון אם אולי תרצה לחזור אליה.</div>
    <div class="modal-actions">
      <button id="cancelDeleteBtn" class="btn ghost" data-i18n="cancel">ביטול</button>
      <button id="confirmDeleteBtn" class="btn danger" data-i18n="delete">מחיקה</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast"></div>

<script>

    },

      cancel:'Cancel', delete:'Delete', edit:'Edit', archive:'Archive',
      restore:'Restore', done:'Done', menu:'Actions', due:'Due now',
      scheduled:'Scheduled', repeats:'Repeats', random:'Random', noText:'Write something first.',
      added:'Thought added.', updated:'Thought updated.', deleted:'Thought deleted.',
      archivedToast:'Moved to archive.', restoredToast:'Restored.',
      completed:'Marked done.', nextScheduled:'Next occurrence scheduled automatically.',
      speechUnsupported:'Voice dictation is not supported in this browser.',
      allowNotif:'You can enable browser notifications to receive reminders while the app is active.', showReminders:'Show reminders', dueListTitle:'Reminders waiting for you', close:'Close', transferToSite:'Transfer to website', transferred:'Your thoughts are ready to transfer.'
    }
  };

  const $ = id => document.getElementById(id);
  const listEl = $('list');
  const emptyEl = $('empty');

  function t(k){ return i18n[state.lang][k] || k; }

  function setLanguage(lang){
    state.lang = lang;
    localStorage.setItem('thoughts_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
    $('langBtn').textContent = lang === 'he' ? 'EN' : 'עברית';
    render();
  }

  function migrateLegacy(){
    if (localStorage.getItem(STORAGE_KEY)) return;
    for(const key of LEGACY_KEYS){
      try{
        const raw = localStorage.getItem(key);
        if(!raw) continue;
        const arr = JSON.parse(raw);
        if(!Array.isArray(arr)) continue;
        state.items = arr.map((x, idx) => ({
          id: String(x.id || crypto.randomUUID?.() || Date.now() + '_' + idx),
          text: x.text || x.title || x.content || '',
          type: x.type === 'friend' ? 'friend' : 'thought',
          createdAt: x.createdAt || new Date().toISOString(),
          archived: !!x.archived,
          done: !!x.done,
          schedule: x.schedule || null,
          random: x.random || null,
          lastNotifiedAt: x.lastNotifiedAt || null
        })).filter(x => x.text);
        save();
        return;
      }catch(e){}
    }
  }

  function load(){
    migrateLegacy();
    try{
      state.items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if(!Array.isArray(state.items)) state.items = [];
      state.items = state.items.map(x => ({...x, type:x.type === 'friend' ? 'friend' : 'thought'}));
    }catch(e){ state.items = []; }
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
  }

  function importFromHash(){
    const m = location.hash.match(/^#thoughts-transfer=(.+)$/);
    if(!m) return;
    try{
      const incoming = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
      if(Array.isArray(incoming)){
        const seen = new Set(state.items.map(x => (x.text||'')+'|'+(x.createdAt||'')));
        for(const item of incoming){
          const key=(item.text||'')+'|'+(item.createdAt||'');
          if(!seen.has(key)){ state.items.push(item); seen.add(key); }
        }
        save();
      }
      history.replaceState(null,'',location.pathname+location.search);
    }catch(e){}
  }

  function toast(msg){
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  function uid(){
    return (crypto.randomUUID && crypto.randomUUID()) || Date.now().toString(36)+Math.random().toString(36).slice(2);
  }

  function formatDateTime(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(Number.isNaN(d.getTime())) return '';
    return new Intl.DateTimeFormat(state.lang === 'he' ? 'he-IL':'en-GB',{
      dateStyle:'medium', timeStyle:'short'
    }).format(d);
  }

  function repeatLabel(value){
    return ({
      none:t('repeatNone'), weekly:t('repeatWeekly'), biweekly:t('repeatBiweekly'),
      monthly:t('repeatMonthly'), bimonthly:t('repeatBimonthly')
    })[value || 'none'];
  }

  function randomLabel(value){
    return ({
      daily:t('randomDaily'), '3days':t('random3Days'), weekly:t('randomWeekly'), biweekly:t('randomBiweekly')
    })[value || 'daily'];
  }

  function scheduledIso(schedule){
    if(!schedule?.date || !schedule?.time) return null;
    const d = new Date(`${schedule.date}T${schedule.time}:00`);
    return Number.isNaN(d.getTime()) ? null : d.toISOString();
  }

  function isDue(item){
    const iso = scheduledIso(item.schedule);
    if(iso && new Date(iso).getTime() <= Date.now()) return true;
    if(item.random?.enabled && item.random.nextAt && new Date(item.random.nextAt).getTime() <= Date.now()) return true;
    return false;
  }

  function addMonthsClamped(date, months){
    const d = new Date(date);
    const originalDay = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth()+months);
    const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(originalDay, lastDay));
    return d;
  }

  function nextRecurringDate(current, repeat){
    const d = new Date(current);
    if(repeat === 'weekly') d.setDate(d.getDate()+7);
    if(repeat === 'biweekly') d.setDate(d.getDate()+14);
    if(repeat === 'monthly') return addMonthsClamped(d,1);
    if(repeat === 'bimonthly') return addMonthsClamped(d,2);
    return d;
  }

  function randomWindowMs(freq){
    return ({daily:86400000,'3days':259200000,weekly:604800000,biweekly:1209600000})[freq] || 86400000;
  }

  function makeRandomNext(freq){
    const span = randomWindowMs(freq);
    const min = Math.min(2*60*60*1000, span*0.15);
    return new Date(Date.now() + min + Math.random()*(span-min)).toISOString();
  }

  function normalizeRandom(random){
    if(!random?.enabled) return null;
    return {
      enabled:true,
      frequency:random.frequency || 'daily',
      nextAt: random.nextAt || makeRandomNext(random.frequency || 'daily')
    };
  }

  function render(){
    const filtered = state.items.filter(item => {
      if(state.filter === 'active') return !item.archived;
      if(state.filter === 'archived') return item.archived;
      return true;
    }).sort((a,b) => {
      const ad = isDue(a) ? 0 : 1;
      const bd = isDue(b) ? 0 : 1;
      if(ad !== bd) return ad-bd;
      return new Date(b.createdAt)-new Date(a.createdAt);
    });

    listEl.innerHTML = '';
    emptyEl.classList.toggle('hidden', filtered.length !== 0);
    const dueItems = state.items.filter(x => !x.archived && isDue(x));
    $('dueBar').classList.toggle('show', dueItems.length > 0);
    $('dueSummary').textContent = state.lang === 'he' ? `יש לך ${dueItems.length} תזכורות` : `You have ${dueItems.length} reminders`;

    for(const item of filtered){
      const card = document.createElement('article');
      card.className = 'card' + (item.type === 'friend' ? ' friend-card' : '') + (isDue(item) ? ' due-card' : '');
      card.dataset.id = item.id;

      const chips = [`<span class="chip ${item.type==='friend'?'friend':''}">${escapeHtml(item.type==='friend'?t('typeFriend'):t('typeThought'))}</span>`];
      const iso = scheduledIso(item.schedule);
      if(isDue(item)) chips.push(`<span class="chip due">${escapeHtml(t('due'))}</span>`);
      if(iso) chips.push(`<span class="chip">${escapeHtml(t('scheduled'))}: ${escapeHtml(formatDateTime(iso))}</span>`);
      if(item.schedule?.repeat && item.schedule.repeat !== 'none') chips.push(`<span class="chip repeat">${escapeHtml(t('repeats'))}: ${escapeHtml(repeatLabel(item.schedule.repeat))}</span>`);
      if(item.random?.enabled) chips.push(`<span class="chip random">${escapeHtml(t('random'))}: ${escapeHtml(randomLabel(item.random.frequency))}</span>`);
      if(item.done) chips.push(`<span class="chip done">${escapeHtml(t('done'))}</span>`);

      card.innerHTML = `
        <div class="card-top">
          <div style="flex:1">
            <div class="thought">${escapeHtml(item.text)}</div>
            <div class="chips">${chips.join('')}</div>
          </div>
        </div>
        <div class="actions">
          <button class="small-action edit">${escapeHtml(t('edit'))}</button>
          <button class="small-action delete">${escapeHtml(t('delete'))}</button>
          <button class="small-action complete">${escapeHtml(t('done'))}</button>
          <button class="small-action archive">${escapeHtml(item.archived ? t('restore'):t('archive'))}</button>
        </div>
        <div class="meta">${escapeHtml(formatDateTime(item.createdAt))}</div>
      `;
      listEl.appendChild(card);
    }
  }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  function openSchedule({targetId=null, initial=null}={}){
    state.scheduleTargetId = targetId;
    const schedule = initial?.schedule || (targetId ? state.items.find(x=>x.id===targetId)?.schedule : state.pendingSchedule?.schedule) || null;
    const random = initial?.random || (targetId ? state.items.find(x=>x.id===targetId)?.random : state.pendingSchedule?.random) || null;

    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    $('scheduleDate').value = schedule?.date || `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    $('scheduleTime').value = schedule?.time || `${pad(now.getHours()+1 > 23 ? 23 : now.getHours()+1)}:00`;
    $('repeatSelect').value = schedule?.repeat || 'none';
    $('randomEnabled').checked = !!random?.enabled;
    $('randomFrequency').value = random?.frequency || 'daily';
    $('randomFrequencyWrap').classList.toggle('hidden', !$('randomEnabled').checked);
    $('scheduleDialog').showModal();
  }

  function readScheduleForm(){
    const hasDateTime = $('scheduleDate').value && $('scheduleTime').value;
    const schedule = hasDateTime ? {
      date:$('scheduleDate').value,
      time:$('scheduleTime').value,
      repeat:$('repeatSelect').value
    } : null;
    const random = $('randomEnabled').checked ? normalizeRandom({
      enabled:true,
      frequency:$('randomFrequency').value,
      nextAt:null
    }) : null;
    return {schedule, random};
  }

  function advanceAfterDone(item){
    const repeat = item.schedule?.repeat;
    const iso = scheduledIso(item.schedule);
    if(iso && repeat && repeat !== 'none'){
      let next = nextRecurringDate(new Date(iso), repeat);
      while(next.getTime() <= Date.now()){
        next = nextRecurringDate(next, repeat);
      }
      const pad = n => String(n).padStart(2,'0');
      item.schedule.date = `${next.getFullYear()}-${pad(next.getMonth()+1)}-${pad(next.getDate())}`;
      item.schedule.time = `${pad(next.getHours())}:${pad(next.getMinutes())}`;
      item.done = false;
      item.lastNotifiedAt = null;
      if(item.random?.enabled) item.random.nextAt = makeRandomNext(item.random.frequency);
      toast(t('nextScheduled'));
      return;
    }
    item.done = true;
  }

  function maybeNotify(){
    const dueItems = state.items.filter(x => !x.archived && isDue(x));
    for(const item of dueItems){
      const now = Date.now();
      const last = item.lastNotifiedAt ? new Date(item.lastNotifiedAt).getTime() : 0;
      if(now-last < 15*60*1000) continue;

      item.lastNotifiedAt = new Date().toISOString();

      if(item.random?.enabled && item.random.nextAt && new Date(item.random.nextAt).getTime() <= now){
        item.random.nextAt = makeRandomNext(item.random.frequency);
      }

      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification(state.lang === 'he' ? 'תזכורת מהמחשבות' : 'Thought reminder', {body:item.text}); }catch(e){}
      }
    }
    if(dueItems.length){
      save();
      render();
    }
  }

  $('addBtn').addEventListener('click', () => {
    const text = $('thoughtInput').value.trim();
    if(!text){ toast(t('noText')); return; }
    const pending = state.pendingSchedule || {schedule:null,random:null};
    state.items.push({
      id:uid(), text, type:$('newType').value === 'friend' ? 'friend' : 'thought', createdAt:new Date().toISOString(), archived:false, done:false,
      schedule:pending.schedule || null, random:normalizeRandom(pending.random), lastNotifiedAt:null
    });
    $('thoughtInput').value = '';
    state.pendingSchedule = null;
    save(); render(); toast(t('added'));
  });

  $('scheduleNewBtn').addEventListener('click', () => openSchedule());

  $('randomEnabled').addEventListener('change', () => {
    $('randomFrequencyWrap').classList.toggle('hidden', !$('randomEnabled').checked);
  });

  $('scheduleForm').addEventListener('submit', e => {
    e.preventDefault();
    const value = readScheduleForm();

    if(state.scheduleTargetId){
      const item = state.items.find(x=>x.id===state.scheduleTargetId);
      if(item){
        item.schedule = value.schedule;
        item.random = normalizeRandom(value.random);
        item.done = false;
        item.lastNotifiedAt = null;
        save(); render(); toast(t('updated'));
      }
    }else{
      state.pendingSchedule = value;
      toast(t('updated'));
    }
    state.scheduleTargetId = null;
    $('scheduleDialog').close();
  });

  $('clearScheduleBtn').addEventListener('click', () => {
    if(state.scheduleTargetId){
      const item = state.items.find(x=>x.id===state.scheduleTargetId);
      if(item){ item.schedule=null; item.random=null; item.lastNotifiedAt=null; save(); render(); }
    }else{
      state.pendingSchedule = null;
    }
    state.scheduleTargetId = null;
    $('scheduleDialog').close();
  });

  listEl.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if(!card) return;
    const id = card.dataset.id;
    const item = state.items.find(x=>x.id===id);
    if(!item) return;

    if(e.target.closest('.edit')){
      state.editTargetId = id;
      $('editType').value = item.type === 'friend' ? 'friend' : 'thought';
      $('editText').value = item.text;
      $('editDialog').showModal();
      return;
    }
    if(e.target.closest('.complete')){
      advanceAfterDone(item);
      save(); render(); toast(t('completed'));
      return;
    }
    if(e.target.closest('.archive')){
      item.archived = !item.archived;
      save(); render(); toast(item.archived ? t('archivedToast'):t('restoredToast'));
      return;
    }
    if(e.target.closest('.delete')){
      state.deleteTargetId = id;
      $('deleteDialog').showModal();
      return;
    }
  });

  $('editForm').addEventListener('submit', e => {
    e.preventDefault();
    const item = state.items.find(x=>x.id===state.editTargetId);
    const text = $('editText').value.trim();
    if(item && text){
      item.text = text;
      item.type = $('editType').value === 'friend' ? 'friend' : 'thought';
      save(); render(); toast(t('updated'));
    }
    state.editTargetId = null;
    $('editDialog').close();
  });

  $('editScheduleBtn').addEventListener('click', () => {
    const id = state.editTargetId;
    $('editDialog').close();
    openSchedule({targetId:id});
  });

  $('cancelDeleteBtn').addEventListener('click', () => {
    state.deleteTargetId = null;
    $('deleteDialog').close();
  });

  $('confirmDeleteBtn').addEventListener('click', () => {
    state.items = state.items.filter(x=>x.id!==state.deleteTargetId);
    state.deleteTargetId = null;
    save(); render(); $('deleteDialog').close(); toast(t('deleted'));
  });

  document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    state.filter = tab.dataset.filter;
    render();
  }));

  $('showDueBtn').addEventListener('click', () => {
    const dueItems = state.items.filter(x => !x.archived && isDue(x));
    $('dueList').innerHTML = dueItems.map(item => `<button class="small-action" data-id="${escapeHtml(item.id)}" style="text-align:inherit;padding:12px">${escapeHtml(item.text)}</button>`).join('');
    $('dueDialog').showModal();
  });
  $('closeDueBtn').addEventListener('click', () => $('dueDialog').close());
  $('dueList').addEventListener('click', e => {
    const b=e.target.closest('[data-id]'); if(!b) return;
    $('dueDialog').close();
    state.filter='active';
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter==='active'));
    render();
    setTimeout(()=>document.querySelector('.card[data-id="'+CSS.escape(b.dataset.id)+'"]')?.scrollIntoView({behavior:'smooth',block:'center'}),50);
  });

  $('transferBtn').addEventListener('click', () => {
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify(state.items))));
    location.href = 'https://itamarlev.com/thoughts-assistant/#thoughts-transfer=' + payload;
  });

  $('langBtn').addEventListener('click', () => setLanguage(state.lang === 'he' ? 'en':'he'));

  $('voiceBtn').addEventListener('click', () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast(t('speechUnsupported')); return; }
    const rec = new SR();
    rec.lang = state.lang === 'he' ? 'he-IL':'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = ev => {
      const text = ev.results?.[0]?.[0]?.transcript || '';
      if(text) $('thoughtInput').value = ($('thoughtInput').value + ' ' + text).trim();
    };
    rec.start();
  });

  window.addEventListener('focus', maybeNotify);
  setInterval(maybeNotify, 60000);

  load();
  importFromHash();
  if(location.hostname === 'itamarlev.com' || location.hostname.endsWith('.itamarlev.com')) $('transferBtn').style.display='none';
  setLanguage(state.lang);
  maybeNotify();
})();
</script>
</body>
